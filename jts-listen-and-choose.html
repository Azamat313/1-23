    b.appendChild(el("span", null, lv));
    var hint = LEVEL_HINTS[lv] ? LEVEL_HINTS[lv][App.lang] : "";
    var p = prog[progressKey(lv)];
    b.appendChild(el("span", "chip__meta", p ? p.best + "/" + p.total : hint));
    b.addEventListener("click", function () { App.level = lv; renderChips(); });
    D.levelChips.appendChild(b);
  });
}

function showScreen(name) {
  App.screen = name;
  D.screenStart.hidden = name !== "start";
  D.screenSession.hidden = name !== "session";
  D.screenResult.hidden = name !== "result";
  window.scrollTo(0, 0);
}

/* ---------- session ---------- */
function startSession(queue) {
  App.queue = queue && queue.length ? queue : buildQueue(App.level);
  if (!App.queue.length) { toast(t("toast.noContent")); return; }
  App.idx = 0;
  App.log = [];
  App.score = 0;
  App.ad = freshAdaptState(App.level);
  var saved = Store.get(K_RATE, null);
  if (saved && RATE_STEPS.indexOf(saved) >= 0) App.ad.rate = saved;
  AudioEngine.rate = App.ad.rate;
  showScreen("session");
  renderRound();
}

function refreshRoundChrome() {
  var r = App.round;
  if (!r) return;
  D.hudCounter.textContent = (App.idx + 1) + " / " + App.queue.length;
  D.hudMode.textContent = t("mode." + r.data.mode);
  D.hudScore.textContent = App.score;
  D.hudStreak.hidden = App.ad.streak < 2;
  D.hudStreak.textContent = "🔥 " + App.ad.streak;
  D.hudBar.style.transform = "scaleX(" + (App.idx / App.queue.length) + ")";
  D.taskPromptText.textContent = t("task." + r.data.mode);
  D.btnTranscript.firstElementChild.textContent =
    r.finished ? (D.transcript.classList.contains("is-open") ? t("session.transcriptHide") : t("session.transcript"))
               : t("session.locked");
  paintSpeed();
  paintReplay();
}

function paintSpeed() {
  Array.prototype.forEach.call(D.speedSwitch.querySelectorAll("button"), function (b) {
    b.setAttribute("aria-pressed", parseFloat(b.dataset.rate) === AudioEngine.rate ? "true" : "false");
  });
}
function paintReplay() {
  var r = App.round;
  if (!r) return;
  var lim = replayLimit(r.data.level);
  if (lim === Infinity) { D.audioLeft.textContent = ""; D.btnReplay.disabled = false; return; }
  var left = Math.max(0, lim - r.listens);
  D.audioLeft.textContent = left > 0 ? t("audio.left", { n: left }) : t("audio.noLeft");
  D.btnReplay.disabled = left <= 0;
}

function feedback(kind, text, actionLabel, actionFn) {
  D.feedback.className = "feedback" + (kind === "ok" ? " is-ok" : kind === "err" ? " is-err" : "");
  D.feedbackText.textContent = text || "";
  var old = D.feedback.querySelector(".btn");
  if (old) old.remove();
  if (actionLabel) {
    var b = el("button", "btn btn--primary", actionLabel);
    b.type = "button";
    b.id = "btnAdvance";
    b.addEventListener("click", actionFn);
    D.feedback.appendChild(b);
  }
}

function renderRound() {
  var data = App.queue[App.idx];
  App.round = {
    data: data,
    listens: 0,
    attempts: 0,
    misses: 0,
    finished: false,
    chunksHeard: 0,
    pinsFound: [],
    visible: visibleOptions(data, App.ad.cap, App.ad.hardPool)
  };
  D.transcript.classList.remove("is-open");
  D.transcriptBody.hidden = true;
  D.btnTranscript.disabled = true;
  D.btnTranscript.setAttribute("aria-expanded", "false");
  D.stageHost.innerHTML = "";
  feedback("", t("fb.idle"));
  refreshRoundChrome();

  if (data.mode === "truefalse") buildTrueFalse();
  else if (data.mode === "sequence") buildSequence();
  else if (data.mode === "multipin") buildPinStage(data.options[0], data.options[0].hotspots, true);
  else buildChoose();

  listen(true);
}

/* ---- audio driving ---- */
function listen(isFirst) {
  var r = App.round;
  var lim = replayLimit(r.data.level);
  if (!isFirst && r.listens >= lim) return;
  r.listens++;
  paintReplay();
  if (r.data.mode === "elimination" && r.data.chunks) playElimination(0);
  else AudioEngine.play({ src: MEDIA.resolve(r.data.audio, "audio"), text: r.data.script, accent: r.data.accent });
}
function playElimination(from) {
  var r = App.round, data = r.data, i = from;
  var step = function () {
    if (!App.round || App.round !== r || r.finished || i >= data.chunks.length) return;
    r.chunksHeard = Math.max(r.chunksHeard, i + 1);
    var src = MEDIA.resolve(data.chunkAudio ? data.chunkAudio[i] : null, "audio");
    AudioEngine.play({
      src: src, text: data.chunks[i], accent: data.accent,
      onEnd: function () {
        applyEliminate(i);
        i++;
        if (i < data.chunks.length) setTimeout(step, 550);
      }
    });
  };
  step();
}
function applyEliminate(chunkIdx) {
  var r = App.round, list = (r.data.eliminate || [])[chunkIdx] || [];
  var gone = 0;
  list.forEach(function (originalIdx) {
    var node = D.stageHost.querySelector('.opt[data-oi="' + originalIdx + '"]');
    if (node && !node.classList.contains("is-out")) { node.classList.add("is-out"); gone++; }
  });
  if (gone && !r.finished) feedback("", t("fb.eliminated"));
}

/* ---- option tiles ---- */
function optionTile(entry, displayIdx) {
  var b = el("button", "opt");
  b.type = "button";
  b.dataset.oi = entry.i;
  b.dataset.di = displayIdx;
  b.appendChild(buildMedia(entry.op));
  var num = el("div", "opt__num", String(displayIdx + 1));
  b.appendChild(num);
  var mark = el("div", "opt__mark");
  mark.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2l-3.5-3.5-1.4 1.4L9 19 20 8l-1.4-1.4z"/></svg>';
  b.appendChild(mark);
  return b;
}

function buildChoose() {
  var r = App.round;
  var shown = shuffle(r.visible);
  var grid = el("div", "options");
  grid.dataset.count = String(shown.length);
  shown.forEach(function (entry, di) {
    var tile = optionTile(entry, di);
    tile.addEventListener("click", function () {
      if (tile.dataset.suppressClick) { delete tile.dataset.suppressClick; return; }
      answerChoose(entry, tile);
    });
    /* large-view + swipe between options (mobile) */
    attachLongPressViewer(tile, shown, di);
    grid.appendChild(tile);
  });
  r.shown = shown;
  D.stageHost.appendChild(grid);
}

function answerChoose(entry, tile) {
  var r = App.round;
  if (r.finished || tile.classList.contains("is-out")) return;
  AudioEngine.stop();
  r.attempts++;
  if (entry.op.correct) {
    tile.classList.add("is-correct", "pop");
    Sfx.ok(); buzz(18);
    if (entry.op.hotspots && entry.op.hotspots.length) {
      feedback("ok", t("fb.correct"));
      setTimeout(function () { buildPinStage(entry.op, entry.op.hotspots, false); }, 550);
    } else {
      finishRound(true);
    }
  } else {
    tile.classList.remove("shake");
    void tile.offsetWidth;
    tile.classList.add("shake", "is-wrong");
    setTimeout(function () { tile.classList.remove("is-wrong"); }, 900);
    Sfx.wrong(); buzz([12, 40, 12]);
    feedback("err", t("fb.wrong"));
  }
}

/* ---- true / false ---- */
function buildTrueFalse() {
  var r = App.round;
  var wrap = el("div", "options");
  wrap.dataset.count = "1";
  var tile = optionTile({ op: r.data.options[0], i: 0 }, 0);
  tile.disabled = true;
  tile.querySelector(".opt__num").remove();
  wrap.appendChild(tile);
  var box = el("div", "seq");
  box.appendChild(wrap);
  var row = el("div", "tf");
  [["true", true], ["false", false]].forEach(function (pair, i) {
    var b = el("button", "btn btn--lg " + (pair[1] ? "tf__true" : "tf__false"), t("tf." + pair[0]));
    b.type = "button";
    b.dataset.di = i;
    b.addEventListener("click", function () { answerTF(pair[1], b); });
    row.appendChild(b);
  });
  box.appendChild(row);
  D.stageHost.appendChild(box);
  r.shown = [{ op: r.data.options[0], i: 0 }];
}
function answerTF(value, btn) {
  var r = App.round;
  if (r.finished) return;
  AudioEngine.stop();
  r.attempts++;
  if (value === r.data.tfAnswer) {
    Sfx.ok(); buzz(18);
    btn.classList.add("btn--primary");
    finishRound(true);
  } else {
    Sfx.wrong(); buzz([12, 40, 12]);
    btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
    feedback("err", t("fb.wrong"));
  }
}

/* ---- sequence ---- */
function buildSequence() {
  var r = App.round;
  var box = el("div", "seq");
  var tray = el("div", "seq__tray");
  tray.id = "seqTray";
  var grid = el("div", "options");
  var shown = shuffle(r.data.options.map(function (op, i) { return { op: op, i: i }; }));
  grid.dataset.count = String(Math.min(shown.length, 4));
  r.seq = [];
  r.shown = shown;

  var renderTray = function () {
    tray.innerHTML = "";
    if (!r.seq.length) { tray.appendChild(el("div", "seq__empty", t("fb.seq"))); }
    r.seq.forEach(function (entry, pos) {
      var slot = el("div", "seq__slot");
      slot.draggable = true;
      slot.dataset.pos = String(pos);
      var media = buildMedia(entry.op);
      media.className = "seq__media";
      slot.appendChild(media);
      slot.appendChild(el("div", "seq__idx", String(pos + 1)));
      slot.addEventListener("dragstart", function (e) {
        slot.classList.add("dragging");
        try { e.dataTransfer.setData("text/plain", String(pos)); } catch (err) {}
      });
      slot.addEventListener("dragend", function () { slot.classList.remove("dragging"); });
      slot.addEventListener("dragover", function (e) { e.preventDefault(); });
      slot.addEventListener("drop", function (e) {
        e.preventDefault();
        var from = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if (isNaN(from)) return;
        var moved = r.seq.splice(from, 1)[0];
        r.seq.splice(pos, 0, moved);
        renderTray(); syncTiles();
      });
      tray.appendChild(slot);
    });
    check.disabled = r.seq.length !== shown.length;
    undo.disabled = !r.seq.length;
  };
  var syncTiles = function () {
    Array.prototype.forEach.call(grid.querySelectorAll(".opt"), function (tile) {
      var used = r.seq.some(function (e) { return String(e.i) === tile.dataset.oi; });
      tile.classList.toggle("is-used", used);
    });
  };

  shown.forEach(function (entry, di) {
    var tile = optionTile(entry, di);
    tile.addEventListener("click", function () {
      if (r.finished) return;
      if (r.seq.some(function (e) { return e.i === entry.i; })) return;
      r.seq.push(entry);
      renderTray(); syncTiles();
    });
    grid.appendChild(tile);
  });

  var bar = el("div", "pin__bar");
  var undo = el("button", "btn btn--ghost", t("session.undo"));
  undo.type = "button";
  undo.addEventListener("click", function () { r.seq.pop(); renderTray(); syncTiles(); });
  var check = el("button", "btn btn--primary", t("session.check"));
  check.type = "button";
  check.addEventListener("click", function () {
    if (r.finished) return;
    AudioEngine.stop();
    r.attempts++;
    var ok = r.seq.every(function (e, i) { return e.i === i; });
    if (ok) { Sfx.ok(); buzz(18); finishRound(true); }
    else {
      Sfx.wrong(); buzz([12, 40, 12]);
      feedback("err", t("fb.seqWrong"));
      r.seq = []; renderTray(); syncTiles();
    }
  });
  bar.appendChild(undo); bar.appendChild(check);

  box.appendChild(grid);
  box.appendChild(tray);
  box.appendChild(bar);
  D.stageHost.appendChild(box);
  renderTray(); syncTiles();
}

/* ---- pinpoint / multi-pin ----------------------------------------- */
function buildPinStage(option, hotspots, isMulti) {
  var r = App.round;
  r.pinsFound = [];
  r.pinMiss = 0;
  D.stageHost.innerHTML = "";

  var box = el("div", "pin");
  var frame = el("div", "pin__frame");
  var inner = el("div", "pin__inner");
  var media = buildMedia(option);
  while (media.firstChild) inner.appendChild(media.firstChild);
  frame.appendChild(inner);
  box.appendChild(frame);

  var bar = el("div", "pin__bar");
  var count = el("div", "pin__count");
  var zoom = el("div", "pin__zoom");
  ["−", "+", "⟲"].forEach(function (sym, i) {
    var b = el("button", null, sym);
    b.type = "button";
    b.setAttribute("aria-label", ["zoom out", "zoom in", "reset"][i]);
    b.addEventListener("click", function () {
      if (i === 0) setZoom(view.k / 1.4, 50, 50);
      else if (i === 1) setZoom(view.k * 1.4, 50, 50);
      else { view.k = 1; view.x = 0; view.y = 0; apply(); }
    });
    zoom.appendChild(b);
  });
  bar.appendChild(count); bar.appendChild(zoom);
  box.appendChild(bar);
  D.stageHost.appendChild(box);

  var view = { k: 1, x: 0, y: 0 };
  var apply = function () {
    inner.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.k + ")";
    redrawMarks();
  };
  var clamp = function () {
    var w = frame.clientWidth, h = frame.clientHeight;
    var maxX = w * (view.k - 1), maxY = h * (view.k - 1);
    view.x = Math.min(0, Math.max(-maxX, view.x));
    view.y = Math.min(0, Math.max(-maxY, view.y));
  };
  var setZoom = function (k, cxPct, cyPct) {
    var nk = Math.max(1, Math.min(4, k));
    var w = frame.clientWidth, h = frame.clientHeight;
    var cx = (cxPct / 100) * w, cy = (cyPct / 100) * h;
    var ratio = nk / view.k;
    view.x = cx - ratio * (cx - view.x);
    view.y = cy - ratio * (cy - view.y);
    view.k = nk;
    clamp(); apply();
  };

  var updateCount = function () {
    if (isMulti) count.textContent = t("fb.multi", { n: r.pinsFound.length, t: hotspots.length });
    else count.textContent = "";
  };

  var marks = [];
  var redrawMarks = function () {
    marks.forEach(function (m) {
      m.node.style.left = m.x + "%";
      m.node.style.top = m.y + "%";
    });
  };
  var addMark = function (xPct, yPct, hit) {
    var d = el("div", "pin__dot " + (hit ? "pin__dot--hit" : "pin__dot--miss"));
    d.style.left = xPct + "%";
    d.style.top = yPct + "%";
    inner.appendChild(d);
    marks.push({ node: d, x: xPct, y: yPct });
    if (!hit) setTimeout(function () { d.remove(); }, 1500);
  };
  var revealZone = function (h) {
    if (inner.querySelector('.pin__reveal[data-h="' + h.x + "_" + h.y + '"]')) return;
    var ring = el("div", "pin__reveal");
    ring.dataset.h = h.x + "_" + h.y;
    var rw = Math.max(h.r, 8) * 2;
    ring.style.left = (h.x - rw / 2) + "%";
    ring.style.top = (h.y - (rw * 4 / 3) / 2) + "%";
    ring.style.width = rw + "%";
    ring.style.height = (rw * 4 / 3) + "%";
    inner.appendChild(ring);
  };

  var nextTarget = function () {
    for (var i = 0; i < hotspots.length; i++) {
      if (r.pinsFound.indexOf(i) < 0) return { h: hotspots[i], i: i };
    }
    return null;
  };
  var promptNow = function () {
    var nt = nextTarget();
    if (!nt) return;
    feedback("ok", t("fb.pin", { p: nt.h.prompt || "" }));
    /* the pin prompt is English audio only — never printed before the answer */
    AudioEngine.play({ src: MEDIA.resolve(nt.h.audio, "audio"), text: nt.h.prompt || "", accent: r.data.accent });
  };

  /* hit test in image space; works under zoom / pan because the rect of the
     transformed node already carries the transform */
  var hitTest = function (clientX, clientY) {
    var rect = inner.getBoundingClientRect();
    var xPct = ((clientX - rect.left) / rect.width) * 100;
    var yPct = ((clientY - rect.top) / rect.height) * 100;
    var fingerPct = (44 / rect.width) * 100;   /* at least a 44px finger target */
    var best = null;
    hotspots.forEach(function (h, i) {
      if (r.pinsFound.indexOf(i) >= 0) return;
      var tol = Math.max(h.r, 8, fingerPct);
      var dx = xPct - h.x;
      var dy = (yPct - h.y) * 0.75;           /* 4:3 frame: 1% of height = 0.75% of width */
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist <= tol && (!best || dist < best.dist)) best = { i: i, dist: dist, h: h };
    });
    return { xPct: xPct, yPct: yPct, hit: best };
  };

  var onTap = function (clientX, clientY) {
    if (r.finished && !isMulti) return;
    var res = hitTest(clientX, clientY);
    if (res.hit) {
      r.pinsFound.push(res.hit.i);
      addMark(res.hit.h.x, res.hit.h.y, true);
      Sfx.ok(); buzz(18);
      r.pinMiss = 0;
      updateCount();
      if (r.pinsFound.length >= hotspots.length) {
        feedback("ok", isMulti ? t("fb.multiDone") : t("fb.pinHit"));
        finishRound(true);
      } else {
        setTimeout(promptNow, 450);
      }
    } else {
      r.misses++;
      r.pinMiss++;
      addMark(res.xPct, res.yPct, false);
      Sfx.wrong(); buzz([12, 40, 12]);
      if (r.pinMiss >= 2) {
        var nt = nextTarget();
        if (nt) revealZone(nt.h);
        feedback("err", t("fb.pinMiss") + " · " + t("fb.pinMissHint"));
      } else {
        feedback("err", t("fb.pinMiss"));
      }
    }
  };

  /* pointer handling: tap vs pan vs pinch */
  var pts = {}, moved = false, startDist = 0, startK = 1, startMid = null;
  frame.addEventListener("pointerdown", function (e) {
    frame.setPointerCapture(e.pointerId);
    pts[e.pointerId] = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY };
    moved = false;
    var ids = Object.keys(pts);
    if (ids.length === 2) {
      var a = pts[ids[0]], b = pts[ids[1]];
      startDist = Math.hypot(a.x - b.x, a.y - b.y);
      startK = view.k;
      var rect = frame.getBoundingClientRect();
      startMid = { x: ((a.x + b.x) / 2 - rect.left) / rect.width * 100, y: ((a.y + b.y) / 2 - rect.top) / rect.height * 100 };
    }
  });
  frame.addEventListener("pointermove", function (e) {
    if (!pts[e.pointerId]) return;
    var prev = pts[e.pointerId];
    var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    prev.x = e.clientX; prev.y = e.clientY;
    if (Math.hypot(e.clientX - prev.x0, e.clientY - prev.y0) > 8) moved = true;
    var ids = Object.keys(pts);
    if (ids.length === 2 && startDist) {
      var a = pts[ids[0]], b = pts[ids[1]];
      var d = Math.hypot(a.x - b.x, a.y - b.y);
      setZoom(startK * (d / startDist), startMid.x, startMid.y);
      moved = true;
    } else if (view.k > 1) {
      view.x += dx; view.y += dy; clamp(); apply(); moved = true;
    }
  });
  var release = function (e) {
    var had = pts[e.pointerId];
    delete pts[e.pointerId];
    if (Object.keys(pts).length < 2) startDist = 0;
    if (had && !moved && Object.keys(pts).length === 0) onTap(e.clientX, e.clientY);
  };
  frame.addEventListener("pointerup", release);
  frame.addEventListener("pointercancel", function (e) { delete pts[e.pointerId]; });
  frame.addEventListener("wheel", function (e) {
    e.preventDefault();
    var rect = frame.getBoundingClientRect();
    setZoom(view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12),
      ((e.clientX - rect.left) / rect.width) * 100, ((e.clientY - rect.top) / rect.height) * 100);
  }, { passive: false });

  updateCount();
  setTimeout(promptNow, isMulti ? 200 : 100);
}

/* ---- large view with swipe (mobile-friendly) ---- */
function attachLongPressViewer(tile, shown, di) {
  var timer = null, x0 = 0, y0 = 0;
  tile.addEventListener("pointerdown", function (e) {
    x0 = e.clientX; y0 = e.clientY;
    clearTimeout(timer);
    timer = setTimeout(function () {
      tile.dataset.suppressClick = "1";   /* the pointerup that follows must not pick */
      openViewer(shown, di);
    }, 480);
  });
  tile.addEventListener("pointermove", function (e) {
    if (Math.hypot(e.clientX - x0, e.clientY - y0) > 10) clearTimeout(timer);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) {
    tile.addEventListener(ev, function () { clearTimeout(timer); });
  });
}
function openViewer(shown, startIdx) {
  var i = startIdx;
  var ov = el("div", "viewer");
  var media = el("div", "viewer__media");
  var dots = el("div", "viewer__dots");
  var draw = function () {
    media.innerHTML = "";
    var m = buildMedia(shown[i].op);
    while (m.firstChild) media.appendChild(m.firstChild);
    dots.innerHTML = "";
    shown.forEach(function (_, k) {
      var d = el("i", k === i ? "on" : null);
      dots.appendChild(d);
    });
  };
  var go = function (step) { i = (i + step + shown.length) % shown.length; draw(); };
  var close = function () { ov.remove(); document.removeEventListener("keydown", key, true); };
  var key = function (e) {
    if (e.key === "Escape") { e.stopPropagation(); close(); }
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
  };
  var bar = el("div", "viewer__bar");
  var prev = el("button", "btn btn--icon btn--ghost", "‹"); prev.type = "button";
  var next = el("button", "btn btn--icon btn--ghost", "›"); next.type = "button";
  var pickBtn = el("button", "btn btn--primary", t("viewer.choose")); pickBtn.type = "button";
  prev.addEventListener("click", function () { go(-1); });
  next.addEventListener("click", function () { go(1); });
  pickBtn.addEventListener("click", function () {
    var tile = D.stageHost.querySelector('.opt[data-oi="' + shown[i].i + '"]');
    close();
    if (tile) tile.click();
  });
  bar.appendChild(prev); bar.appendChild(pickBtn); bar.appendChild(next);
  var closeBtn = el("button", "viewer__close", "✕"); closeBtn.type = "button";
  closeBtn.addEventListener("click", close);
  ov.appendChild(closeBtn); ov.appendChild(media); ov.appendChild(dots); ov.appendChild(bar);
  ov.addEventListener("click", function (e) { if (e.target === ov) close(); });
  /* swipe */
  var sx = null;
  ov.addEventListener("pointerdown", function (e) { sx = e.clientX; });
  ov.addEventListener("pointerup", function (e) {
    if (sx === null) return;
    var dx = e.clientX - sx;
    sx = null;
    if (Math.abs(dx) > 48) go(dx < 0 ? 1 : -1);
  });
  document.addEventListener("keydown", key, true);
  document.body.appendChild(ov);
  draw();
}

/* ---------------------------------------------------------------------
   Phase 2 — declared here so the session flow already has the seams.
   Nothing below is switched on; enabling a flag is the only change needed.
   Data schema additions each one expects are documented inline.
   --------------------------------------------------------------------- */
var PHASE2 = {
  /* round.detail = { audio, question, options:[{img|scene, correct}] }
     Runs after finishRound(), before the advance button appears. */
  detailFollowup: {
    enabled: false,
    applies: function (data) { return !!data.detail; },
    run: function (data, done) { done(); }
  },
  /* Shadowing. round.shadow = true. Needs MediaRecorder for capture and
     Web Speech API recognition for scoring — both probed, never assumed. */
  sayItBack: {
    enabled: false,
    supported: function () {
      return !!(window.MediaRecorder && (window.SpeechRecognition || window.webkitSpeechRecognition));
    },
    applies: function (data) { return data.shadow === true; },
    run: function (data, done) { done(); }
  },
  /* Streak combo multiplier applied on top of scoreRound(). */
  streakCombo: {
    enabled: false,
    multiplier: function (streak) { return 1 + Math.min(0.5, Math.floor(streak / 3) * 0.1); }
  }
};

/* ---- finishing a round ---- */
function scoreRound(r) {
  var base = 100;
  var pts = Math.max(20, base - 30 * (r.attempts - 1) - 10 * r.misses);
  if (r.data.mode === "elimination" && r.data.chunks) {
    pts += 20 * Math.max(0, r.data.chunks.length - r.chunksHeard);
  }
  if (PHASE2.streakCombo.enabled) pts = Math.round(pts * PHASE2.streakCombo.multiplier(App.ad.streak));
  return pts;
}
function finishRound(ok) {
  var r = App.round;
  if (r.finished) return;
  r.finished = true;
  AudioEngine.stop();
  var firstTry = r.attempts <= 1 && r.misses === 0;
  var pts = scoreRound(r);
  App.score += pts;
  App.ad = adapt(App.ad, firstTry);
  AudioEngine.rate = App.ad.rate;
  Store.set(K_RATE, App.ad.rate);

  App.log.push({
    id: r.data.id, mode: r.data.mode, ok: !!ok, firstTry: firstTry,
    attempts: r.attempts, misses: r.misses, listens: r.listens, rate: AudioEngine.rate,
    data: r.data, points: pts
  });

  /* transcript unlocks only now */
  D.btnTranscript.disabled = false;
  buildTranscript(r.data);
  Array.prototype.forEach.call(D.stageHost.querySelectorAll(".opt"), function (n) { n.disabled = true; });
  var last = App.idx >= App.queue.length - 1;
  var offerAdvance = function () {
    feedback("ok", t("fb.correct") + " +" + pts, last ? t("session.finish") : t("session.next"), nextRound);
    refreshRoundChrome();
  };
  /* phase-2 seams: each stage either runs and calls back, or is skipped */
  var stages = [PHASE2.detailFollowup, PHASE2.sayItBack].filter(function (st) {
    return st.enabled && st.applies(r.data) && (!st.supported || st.supported());
  });
  (function chain(k) {
    if (k >= stages.length) { offerAdvance(); return; }
    stages[k].run(r.data, function () { chain(k + 1); });
  })(0);
}
function nextRound() {
  if (App.idx >= App.queue.length - 1) { showResult(); return; }
  App.idx++;
  renderRound();
}

function buildTranscript(data) {
  D.transcriptBody.innerHTML = "";
  var en = el("div", "transcript__en", data.script);
  D.transcriptBody.appendChild(en);
  if (App.lang !== "en") {
    var tr = el("div", "transcript__tr", data.translations[App.lang] || "");
    D.transcriptBody.appendChild(tr);
  }
  if (data.vocab && data.vocab.length) {
    var v = el("div", "vocab");
    data.vocab.forEach(function (w) { v.appendChild(el("span", null, w)); });
    D.transcriptBody.appendChild(v);
  }
}

/* ---- result ---- */
function showResult() {
  AudioEngine.stop();
  var key = progressKey(App.level);
  var prog = getProgress();
  var correct = App.log.filter(function (x) { return x.firstTry; }).length;
  var prev = prog[key] || { best: 0, points: 0, plays: 0, total: App.queue.length };
  prog[key] = {
    best: Math.max(prev.best, correct),
    total: App.queue.length,
    points: Math.max(prev.points, App.score),
    plays: (prev.plays || 0) + 1
  };
  Store.set(K_PROG, prog);
  showScreen("result");
  renderResult();
}
function renderResult() {
  var total = App.log.length || 1;
  var correct = App.log.filter(function (x) { return x.firstTry; }).length;
  var replays = App.log.reduce(function (a, x) { return a + Math.max(0, x.listens - 1); }, 0);
  var avg = App.log.reduce(function (a, x) { return a + x.rate; }, 0) / total;
  D.scoreValue.textContent = App.score;
  D.scoreRing.style.setProperty("--p", Math.round((correct / total) * 100) + "%");
  D.resultSub.textContent = t("result.sub", { c: correct, t: total });
  D.statCorrect.textContent = correct + " / " + total;
  D.statReplays.textContent = replays;
  D.statSpeed.textContent = avg.toFixed(2).replace(/0$/, "") + "×";
  D.statStreak.textContent = App.ad ? App.ad.bestStreak : 0;
  D.wordList.innerHTML = "";
  App.log.forEach(function (x) {
    var row = el("div", "wordrow");
    row.appendChild(el("b", null, (x.data.vocab || []).join(" · ") || x.data.script));
    row.appendChild(el("span", null, App.lang === "en" ? x.data.script : (x.data.translations[App.lang] || "")));
    D.wordList.appendChild(row);
  });
}

/* ---- toast ---- */
var toastTimer = 0;
function toast(msg) {
  D.toast.textContent = msg;
  D.toast.classList.add("is-on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { D.toast.classList.remove("is-on"); }, 2200);
}

/* ---- theme ---- */
function applyTheme(mode) {
  Store.set(K_THEME, mode);
  if (mode === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
}

/* ---------------------------------------------------------------------
   9. Boot
   --------------------------------------------------------------------- */
function boot() {
  ["screenStart", "screenSession", "screenResult", "langSwitch", "levelChips",
   "btnStart", "btnResetProgress", "hudCounter", "hudMode", "hudStreak", "hudScore", "hudBar",
   "audioBox", "btnReplay", "audioTrack", "audioPlayed", "audioLeft", "audioStatus", "speedSwitch",
   "btnQuit", "taskPromptText", "stageHost", "feedback", "feedbackText", "transcript",
   "btnTranscript", "transcriptBody", "scoreRing", "scoreValue", "resultSub", "statCorrect",
   "statReplays", "statSpeed", "statStreak", "wordList", "btnNextSet", "btnRepeatMistakes",
   "btnHome", "toast", "btnTheme"].forEach(function (id) { D[id] = $(id); });

  AudioEngine.init({ box: D.audioBox, played: D.audioPlayed, track: D.audioTrack, status: D.audioStatus });
  AudioEngine.rate = Store.get(K_RATE, 1);
  applyTheme(Store.get(K_THEME, "auto"));
  setLang(Store.get(K_LANG, (navigator.language || "ru").slice(0, 2) === "kk" ? "kz" :
    (navigator.language || "ru").slice(0, 2) === "en" ? "en" : "ru"));

  D.langSwitch.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (b) setLang(b.dataset.lang);
  });
  D.btnTheme.addEventListener("click", function () {
    var cur = Store.get(K_THEME, "auto");
    applyTheme(cur === "auto" ? "light" : cur === "light" ? "dark" : "auto");
  });
  D.btnStart.addEventListener("click", function () { Sfx.ac(); startSession(null); });
  D.btnResetProgress.addEventListener("click", function () {
    Store.del(K_PROG); renderChips(); toast(t("toast.reset"));
  });
  D.btnQuit.addEventListener("click", function () { AudioEngine.stop(); showScreen("start"); renderChips(); });
  D.btnReplay.addEventListener("click", function () { listen(false); });
  D.speedSwitch.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-rate]");
    if (!b) return;
    AudioEngine.setRate(parseFloat(b.dataset.rate));
    if (App.ad) App.ad.rate = AudioEngine.rate;
    paintSpeed();
  });
  var seekFromEvent = function (e) {
    if (!AudioEngine.seekable()) return;
    var r = D.audioTrack.getBoundingClientRect();
    AudioEngine.seek((e.clientX - r.left) / r.width);
  };
  D.audioTrack.addEventListener("pointerdown", seekFromEvent);
  D.audioTrack.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      if (AudioEngine.seekable()) {
        var p = AudioEngine.el.currentTime / AudioEngine.el.duration;
        AudioEngine.seek(p + (e.key === "ArrowRight" ? 0.05 : -0.05));
      }
    }
  });
  D.btnTranscript.addEventListener("click", function () {
    if (D.btnTranscript.disabled) return;
    var open = D.transcript.classList.toggle("is-open");
    D.transcriptBody.hidden = !open;
    D.btnTranscript.setAttribute("aria-expanded", open ? "true" : "false");
    D.btnTranscript.firstElementChild.textContent = open ? t("session.transcriptHide") : t("session.transcript");
  });
  D.btnNextSet.addEventListener("click", function () { startSession(null); });
  D.btnHome.addEventListener("click", function () { showScreen("start"); renderChips(); });
  D.btnRepeatMistakes.addEventListener("click", function () {
    var bad = App.log.filter(function (x) { return !x.firstTry; }).map(function (x) { return x.data; });
    if (!bad.length) { toast(t("toast.noMistakes")); return; }
    startSession(alternateModes(bad));
  });

  /* keyboard: Space = replay, 1..6 = pick, Enter = next, S = speed */
  document.addEventListener("keydown", function (e) {
    if (App.screen !== "session") return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    if (e.code === "Space") {
      e.preventDefault();
      if (!D.btnReplay.disabled) listen(false);
    } else if (e.key === "Enter") {
      var adv = $("btnAdvance");
      if (adv) { e.preventDefault(); adv.click(); }
    } else if (e.key === "s" || e.key === "S" || e.key === "ы" || e.key === "Ы") {
      var i = RATE_STEPS.indexOf(AudioEngine.rate);
      AudioEngine.setRate(RATE_STEPS[(i + 1) % RATE_STEPS.length]);
      paintSpeed();
      toast(t("toast.speed", { n: AudioEngine.rate }));
    } else if (/^[1-6]$/.test(e.key)) {
      var n = parseInt(e.key, 10) - 1;
      var node = D.stageHost.querySelector('[data-di="' + n + '"]');
      if (node && !node.disabled) node.click();
    }
  });

  /* speechSynthesis voices arrive asynchronously in some browsers */
  if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = function () { /* cached lazily on next speak */ };
  }

  renderChips();
  runSelfTests();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
</body>

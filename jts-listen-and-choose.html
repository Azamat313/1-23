<!DOCTYPE html>
<html lang="ru" data-lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Just To Study — Listen &amp; Choose: choose a picture by audio description.">
<title>JTS · Listen &amp; Choose</title>
<style>
/* ============================================================
   JTS design tokens. Everything themable lives here.
   ============================================================ */
:root{
  /* brand */
  --jts-violet:#874BF8;
  --jts-violet-600:#6F31E8;
  --jts-violet-100:#EFE7FF;
  --jts-cyan:#0AAFFF;
  --jts-cyan-100:#E1F4FF;
  --jts-green:#00D441;
  --jts-green-100:#E0FBEA;
  --jts-orange:#FF631E;
  --jts-orange-100:#FFEAE1;
  --jts-gold:#FFAD00;
  --jts-gold-100:#FFF4DC;

  /* semantic surfaces (light) */
  --bg:#F6F4FB;
  --bg-2:#EDE9F8;
  --surface:#FFFFFF;
  --surface-2:#F8F6FD;
  --surface-3:#F0ECFA;
  --line:#E6E1F2;
  --line-strong:#D6CFEA;

  /* text */
  --text:#1D1734;
  --text-2:#5C5478;
  --text-3:#8F88A6;
  --on-accent:#FFFFFF;

  /* state */
  --ok:var(--jts-green);
  --ok-soft:var(--jts-green-100);
  --warn:var(--jts-gold);
  --err:var(--jts-orange);
  --err-soft:var(--jts-orange-100);

  /* radii */
  --r-xs:8px; --r-sm:12px; --r-md:18px; --r-lg:26px; --r-xl:34px; --r-pill:999px;

  /* spacing scale (8pt) */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
  --s-7:32px; --s-8:40px; --s-9:56px;

  /* shadows — soft, brand-tinted */
  --sh-1:0 2px 6px rgba(29,23,52,.06);
  --sh-2:0 8px 22px rgba(89,58,168,.10);
  --sh-3:0 18px 44px rgba(89,58,168,.16);
  --sh-accent:0 10px 26px rgba(135,75,248,.32);
  --ring:0 0 0 4px rgba(135,75,248,.22);

  /* typography */
  --font-head:"PT Root UI","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-text:"SF Pro Display","PT Root UI",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  /* motion */
  --dur-1:150ms; --dur-2:200ms; --dur-3:250ms;
  --ease:cubic-bezier(.22,.61,.36,1);

  /* layout */
  --content-max:1180px;
  --tap:44px;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131020;
    --bg-2:#1A1630;
    --surface:#1E1934;
    --surface-2:#251F3F;
    --surface-3:#2C2549;
    --line:#332B52;
    --line-strong:#463B6B;
    --text:#F3F0FB;
    --text-2:#B9B1D4;
    --text-3:#867DA5;
    --jts-violet-100:#2E2350;
    --jts-cyan-100:#12304A;
    --jts-green-100:#11311F;
    --jts-orange-100:#3A1F14;
    --jts-gold-100:#3A2D10;
    --sh-1:0 2px 6px rgba(0,0,0,.34);
    --sh-2:0 8px 22px rgba(0,0,0,.42);
    --sh-3:0 18px 44px rgba(0,0,0,.52);
    --sh-accent:0 10px 26px rgba(135,75,248,.42);
  }
}
:root[data-theme="dark"]{
  --bg:#131020; --bg-2:#1A1630; --surface:#1E1934; --surface-2:#251F3F; --surface-3:#2C2549;
  --line:#332B52; --line-strong:#463B6B; --text:#F3F0FB; --text-2:#B9B1D4; --text-3:#867DA5;
  --jts-violet-100:#2E2350; --jts-cyan-100:#12304A; --jts-green-100:#11311F;
  --jts-orange-100:#3A1F14; --jts-gold-100:#3A2D10;
  --sh-1:0 2px 6px rgba(0,0,0,.34); --sh-2:0 8px 22px rgba(0,0,0,.42);
  --sh-3:0 18px 44px rgba(0,0,0,.52); --sh-accent:0 10px 26px rgba(135,75,248,.42);
}

/* ============================================================ base */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-text);
  background:var(--bg);
  color:var(--text);
  line-height:1.45;
  overflow-x:hidden;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.2;letter-spacing:-.01em}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none !important}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}

.wrap{width:100%;max-width:var(--content-max);margin:0 auto;padding:0 var(--s-4)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================================================ buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
  min-height:var(--tap);padding:0 var(--s-6);
  border:0;border-radius:var(--r-pill);
  background:var(--surface-3);color:var(--text);
  font-weight:600;font-size:15px;cursor:pointer;
  transition:transform var(--dur-1) var(--ease),opacity var(--dur-1) var(--ease);
  text-align:center;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.btn--primary{background:var(--jts-violet);color:var(--on-accent);box-shadow:var(--sh-accent)}
.btn--ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line-strong);color:var(--text-2)}
.btn--lg{min-height:56px;font-size:17px;padding:0 var(--s-8)}
.btn--block{width:100%}
.btn--icon{padding:0;width:var(--tap);min-width:var(--tap)}

/* ============================================================ topbar */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar__in{display:flex;align-items:center;gap:var(--s-3);min-height:60px}
.logo{display:flex;align-items:center;gap:var(--s-2);font-family:var(--font-head);font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.logo__bubble{
  width:30px;height:30px;flex:0 0 30px;border-radius:12px 12px 12px 5px;
  background:linear-gradient(135deg,var(--jts-violet),var(--jts-cyan));
  box-shadow:var(--sh-accent);
}
.logo__sub{color:var(--text-3);font-weight:600;font-size:13px}
.topbar__spacer{flex:1}

.segmented{display:inline-flex;background:var(--surface-3);border-radius:var(--r-pill);padding:3px;gap:2px}
.segmented button{
  border:0;background:transparent;border-radius:var(--r-pill);
  min-height:34px;min-width:40px;padding:0 var(--s-3);
  font-size:13px;font-weight:700;color:var(--text-3);cursor:pointer;
  transition:color var(--dur-1) var(--ease),background var(--dur-1) var(--ease);
}
.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--jts-violet);box-shadow:var(--sh-1)}

/* ============================================================ cards / panels */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:var(--s-6)}
.panel{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-2)}

/* ============================================================ start screen */
.screen{padding:var(--s-6) 0 var(--s-9)}
.hero{text-align:center;padding:var(--s-6) 0 var(--s-7)}
.hero h1{font-size:clamp(26px,6vw,42px);margin-bottom:var(--s-3)}
.hero p{color:var(--text-2);max-width:56ch;margin:0 auto;font-size:clamp(14px,3.4vw,17px)}
.hero__badge{
  display:inline-flex;align-items:center;gap:var(--s-2);
  background:var(--jts-violet-100);color:var(--jts-violet);
  border-radius:var(--r-pill);padding:6px var(--s-4);font-weight:700;font-size:13px;margin-bottom:var(--s-4);
}
.section-title{font-size:14px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--s-3)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.chip{
  border:0;cursor:pointer;background:var(--surface);color:var(--text-2);
  border-radius:var(--r-pill);min-height:var(--tap);padding:0 var(--s-5);
  font-weight:700;font-size:14px;box-shadow:inset 0 0 0 2px var(--line);
  transition:transform var(--dur-1) var(--ease),color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease);
  display:inline-flex;align-items:center;gap:var(--s-2);
}
.chip:hover{transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--jts-violet);color:var(--on-accent);box-shadow:var(--sh-accent)}
.chip[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.chip__meta{font-weight:600;font-size:12px;opacity:.7}
.start-grid{display:grid;gap:var(--s-5);margin-bottom:var(--s-6)}
.start-actions{display:flex;flex-direction:column;gap:var(--s-3);align-items:stretch}
.start-note{color:var(--text-3);font-size:13px;text-align:center}

/* ============================================================ session layout */
.session{display:grid;gap:var(--s-5)}
.hud{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.hud__counter{font-family:var(--font-head);font-weight:800;font-size:16px;white-space:nowrap}
.hud__pill{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);
  border-radius:var(--r-pill);padding:5px var(--s-3);font-size:13px;font-weight:700;color:var(--text-2);
  white-space:nowrap;
}
.hud__pill--streak{background:var(--jts-gold-100);color:var(--jts-gold)}
.hud__pill--mode{background:var(--jts-cyan-100);color:var(--jts-cyan)}
.progressbar{height:8px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden;width:100%}
.progressbar__fill{height:100%;background:linear-gradient(90deg,var(--jts-violet),var(--jts-cyan));border-radius:var(--r-pill);transform-origin:left center;transform:scaleX(0);transition:transform var(--dur-3) var(--ease)}

/* ---- audio block ---- */
.audio{
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-2);
  padding:var(--s-4);display:grid;gap:var(--s-3);
}
.audio__row{display:flex;align-items:center;gap:var(--s-3)}
.audio__replay{
  width:60px;height:60px;min-width:60px;border-radius:var(--r-pill);border:0;cursor:pointer;
  background:var(--jts-violet);color:var(--on-accent);box-shadow:var(--sh-accent);
  display:flex;align-items:center;justify-content:center;
  transition:transform var(--dur-2) var(--ease);
}
.audio__replay:hover{transform:scale(1.05)}
.audio__replay:active{transform:scale(.95)}
.audio__replay[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.audio__replay svg{width:26px;height:26px;fill:currentColor}
.audio__mid{flex:1;min-width:0;display:grid;gap:6px}
.audio__label{font-size:13px;font-weight:700;color:var(--text-2);display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap}
.audio__left{color:var(--text-3);font-weight:600}
.audio__track{
  height:12px;border-radius:var(--r-pill);background:var(--surface-3);position:relative;cursor:pointer;
  touch-action:none;
}
.audio__track::after{content:"";position:absolute;inset:-10px 0;}
.audio__played{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--jts-violet),var(--jts-cyan))}
.audio__track[aria-disabled="true"]{opacity:.5;cursor:default}
.audio__wave{display:flex;gap:3px;align-items:flex-end;height:12px}
.audio__wave i{width:3px;background:var(--jts-violet);border-radius:2px;height:30%;opacity:.5}
.audio.is-playing .audio__wave i{animation:wv 900ms var(--ease) infinite}
.audio__wave i:nth-child(2){animation-delay:120ms}
.audio__wave i:nth-child(3){animation-delay:240ms}
.audio__wave i:nth-child(4){animation-delay:360ms}
@keyframes wv{0%,100%{height:30%}50%{height:100%}}
.audio__speed{display:flex;gap:4px;background:var(--surface-3);border-radius:var(--r-pill);padding:3px}
.audio__speed button{
  border:0;background:transparent;border-radius:var(--r-pill);min-height:36px;padding:0 10px;
  font-size:13px;font-weight:700;color:var(--text-3);cursor:pointer;
}
.audio__speed button[aria-pressed="true"]{background:var(--surface);color:var(--jts-violet);box-shadow:var(--sh-1)}
.audio__status{font-size:12px;color:var(--text-3);min-height:16px}
.audio__status.is-error{color:var(--err);font-weight:700}

/* ---- task prompt ---- */
.task{
  display:flex;align-items:center;gap:var(--s-3);
  background:var(--jts-violet-100);color:var(--jts-violet);
  border-radius:var(--r-md) var(--r-md) var(--r-md) 6px;
  padding:var(--s-3) var(--s-4);font-weight:700;font-size:14px;
}

/* ---- options grid ---- */
.options{display:grid;gap:var(--s-4)}
.options[data-count="1"]{grid-template-columns:1fr;max-width:620px;margin:0 auto;width:100%}
.options[data-count="2"]{grid-template-columns:repeat(2,1fr)}
.options[data-count="3"]{grid-template-columns:repeat(2,1fr)}
.options[data-count="4"]{grid-template-columns:repeat(2,1fr)}
.options[data-count="5"],.options[data-count="6"]{grid-template-columns:repeat(2,1fr)}

.opt{
  position:relative;border:0;padding:0;cursor:pointer;background:var(--surface);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1);
  transition:transform var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease),opacity var(--dur-3) var(--ease);
  display:block;width:100%;
}
.opt::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 2px var(--line);
  transition:box-shadow var(--dur-2) var(--ease);
}
.opt:hover{transform:translateY(-3px);box-shadow:var(--sh-3)}
.opt__media{position:relative;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden}
.opt__media>img,.opt__media>svg{width:100%;height:100%;object-fit:cover;display:block}
.opt__num{
  position:absolute;top:10px;left:10px;z-index:2;
  min-width:28px;height:28px;border-radius:10px;
  background:color-mix(in srgb,var(--surface) 84%,transparent);
  color:var(--text-2);font-weight:800;font-size:13px;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
}
.opt__mark{
  position:absolute;right:10px;bottom:10px;z-index:3;
  width:34px;height:34px;border-radius:var(--r-pill);display:none;
  align-items:center;justify-content:center;color:#fff;font-weight:800;
  box-shadow:var(--sh-2);
}
.opt.is-correct::after{box-shadow:inset 0 0 0 4px var(--ok)}
.opt.is-correct .opt__mark{display:flex;background:var(--ok)}
.opt.is-wrong::after{box-shadow:inset 0 0 0 4px var(--err)}
.opt.is-wrong .opt__mark{display:flex;background:var(--err)}
.opt.is-out{opacity:.25;pointer-events:none;filter:grayscale(1)}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{transform:none;box-shadow:var(--sh-1)}
.opt.shake{animation:shake var(--dur-3) var(--ease)}
@keyframes shake{
  0%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(2px)}100%{transform:translateX(0)}
}
.opt.pop{animation:pop var(--dur-3) var(--ease)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}

/* true/false */
.tf{display:flex;gap:var(--s-3);justify-content:center;flex-wrap:wrap}
.tf .btn{flex:1 1 150px;max-width:260px}
.tf__true{background:var(--jts-green-100);color:var(--ok)}
.tf__false{background:var(--jts-orange-100);color:var(--err)}

/* ---- pinpoint stage ---- */
.pin{display:grid;gap:var(--s-3)}
.pin__frame{
  position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--surface-2);
  box-shadow:var(--sh-2);touch-action:none;max-width:720px;width:100%;margin:0 auto;
}
.pin__inner{position:relative;aspect-ratio:4/3;transform-origin:0 0;will-change:transform}
.pin__inner>img,.pin__inner>svg{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none}
.pin__dot{
  position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:var(--r-pill);
  pointer-events:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--surface) 70%,transparent);
}
.pin__dot--miss{background:var(--err);animation:ping 700ms var(--ease) 2}
.pin__dot--hit{background:var(--ok)}
@keyframes ping{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.8);opacity:.2}}
.pin__reveal{
  position:absolute;border-radius:var(--r-pill);pointer-events:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--jts-gold) 70%,transparent),0 0 0 12px color-mix(in srgb,var(--jts-gold) 18%,transparent);
  animation:breathe 1.6s var(--ease) infinite;
}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.pin__bar{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;justify-content:center}
.pin__count{font-weight:800;font-family:var(--font-head);font-size:16px;color:var(--jts-violet)}
.pin__zoom{display:flex;gap:4px;background:var(--surface-3);border-radius:var(--r-pill);padding:3px}
.pin__zoom button{border:0;background:transparent;width:36px;height:36px;border-radius:var(--r-pill);font-weight:800;color:var(--text-2);cursor:pointer}

/* ---- sequence ---- */
.seq{display:grid;gap:var(--s-4)}
.seq__tray{
  display:flex;gap:var(--s-3);flex-wrap:wrap;min-height:96px;padding:var(--s-3);
  background:var(--surface-2);border-radius:var(--r-lg);border:2px dashed var(--line-strong);
  align-items:center;justify-content:center;
}
.seq__slot{
  position:relative;width:110px;border-radius:var(--r-md);overflow:hidden;background:var(--surface);
  box-shadow:var(--sh-1);cursor:grab;
}
.seq__slot .seq__media{aspect-ratio:4/3}
.seq__slot .seq__media>img,.seq__slot .seq__media>svg{width:100%;height:100%;object-fit:cover}
.seq__slot .seq__idx{
  position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:8px;
  background:var(--jts-violet);color:#fff;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.seq__slot.dragging{opacity:.5}
.seq__empty{color:var(--text-3);font-size:13px;font-weight:600}
.seq .opt.is-used{opacity:.3;pointer-events:none}

/* ---- feedback zone: fixed height, never shifts layout ---- */
.feedback{
  min-height:78px;display:flex;align-items:center;justify-content:center;gap:var(--s-3);
  border-radius:var(--r-lg);padding:var(--s-3) var(--s-4);flex-wrap:wrap;
  background:var(--surface-2);color:var(--text-3);font-weight:600;font-size:14px;text-align:center;
  transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease);
}
.feedback.is-ok{background:var(--ok-soft);color:var(--ok)}
.feedback.is-err{background:var(--err-soft);color:var(--err)}
.feedback__txt{flex:1 1 180px;min-width:0}
.feedback .btn{flex:0 0 auto}

/* ---- transcript ---- */
.transcript{border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);overflow:hidden}
.transcript__head{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);
  width:100%;border:0;background:transparent;cursor:pointer;
  min-height:var(--tap);padding:var(--s-3) var(--s-4);font-weight:700;font-size:14px;text-align:left;
}
.transcript__head[disabled]{opacity:.45;cursor:not-allowed}
.transcript__body{padding:0 var(--s-4) var(--s-4);display:grid;gap:var(--s-3)}
.transcript__en{font-size:17px;font-weight:700;font-family:var(--font-head)}
.transcript__tr{font-size:15px;color:var(--text-2)}
.vocab{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.vocab span{background:var(--jts-cyan-100);color:var(--jts-cyan);border-radius:var(--r-pill);padding:4px var(--s-3);font-size:13px;font-weight:700}
.caret{transition:transform var(--dur-2) var(--ease)}
.transcript.is-open .caret{transform:rotate(180deg)}

/* ============================================================ result */
.result-head{text-align:center;display:grid;gap:var(--s-3);margin-bottom:var(--s-6)}
.score-ring{
  width:150px;height:150px;margin:0 auto;border-radius:var(--r-pill);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:conic-gradient(var(--jts-violet) var(--p,0%),var(--surface-3) 0);
  position:relative;
}
.score-ring::before{content:"";position:absolute;inset:12px;border-radius:inherit;background:var(--surface)}
.score-ring b{position:relative;font-family:var(--font-head);font-size:34px;line-height:1}
.score-ring small{position:relative;color:var(--text-3);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s-3);margin-bottom:var(--s-6)}
.stat{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--sh-1);padding:var(--s-4);text-align:center}
.stat b{display:block;font-family:var(--font-head);font-size:22px}
.stat span{font-size:12px;color:var(--text-3);font-weight:700}
.wordlist{display:grid;gap:var(--s-2);margin-bottom:var(--s-6)}
.wordrow{
  display:flex;gap:var(--s-3);align-items:baseline;justify-content:space-between;flex-wrap:wrap;
  background:var(--surface);border-radius:var(--r-md);box-shadow:var(--sh-1);padding:var(--s-3) var(--s-4);
}
.wordrow b{font-family:var(--font-head);font-size:15px}
.wordrow span{color:var(--text-2);font-size:14px;text-align:right}
.result-actions{display:grid;gap:var(--s-3)}

/* ============================================================ misc */
.toast{
  position:fixed;left:50%;bottom:calc(var(--s-6) + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:var(--s-3) var(--s-5);border-radius:var(--r-pill);
  font-weight:700;font-size:14px;box-shadow:var(--sh-3);opacity:0;pointer-events:none;
  transition:opacity var(--dur-2) var(--ease),transform var(--dur-2) var(--ease);z-index:90;max-width:90vw;text-align:center;
}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================ responsive */
/* Mobile first is the default above. Tablet: */
@media (min-width:768px){
  .wrap{padding:0 var(--s-6)}
  .screen{padding:var(--s-7) 0 var(--s-9)}
  .start-grid{grid-template-columns:1fr}
  .start-actions{flex-direction:row;justify-content:center}
  .start-actions .btn{min-width:220px}
  .options[data-count="3"]{grid-template-columns:repeat(3,1fr)}
  .options[data-count="5"],.options[data-count="6"]{grid-template-columns:repeat(3,1fr)}
  .stats{grid-template-columns:repeat(4,1fr)}
  .result-actions{grid-template-columns:repeat(2,1fr);max-width:620px;margin:0 auto}
  .audio{padding:var(--s-5)}
  .seq__slot{width:132px}
}
/* Laptop: side-by-side audio + options */
@media (min-width:1280px){
  .session{grid-template-columns:360px minmax(0,1fr);align-items:start;gap:var(--s-6)}
  .session__aside{position:sticky;top:76px;display:grid;gap:var(--s-4)}
  .session__main{display:grid;gap:var(--s-4);min-width:0}
  .hero h1{font-size:44px}
  .seq__slot{width:150px}
}
/* Mobile: sticky audio on top of the scroll area */
@media (max-width:767px){
  .session__aside{position:sticky;top:60px;z-index:20;background:var(--bg);padding-bottom:var(--s-2);display:grid;gap:var(--s-3)}
  .audio{padding:var(--s-3);border-radius:var(--r-md)}
  .audio__replay{width:52px;height:52px;min-width:52px}
  .audio__speed button{padding:0 8px;min-height:34px}
  .logo__sub{display:none}
  .logo{min-width:0}
  .logo>span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar__in{gap:var(--s-2)}
  .segmented button{min-width:32px;padding:0 8px}
  .opt__num{top:8px;left:8px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}
}

/* ---- large view overlay (swipe between options) ---- */
.viewer{
  position:fixed;inset:0;z-index:80;background:rgba(20,15,40,.82);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s-4);padding:var(--s-6) var(--s-4);
}
.viewer__media{
  width:min(92vw,720px);aspect-ratio:4/3;border-radius:var(--r-lg);overflow:hidden;
  background:var(--surface);box-shadow:var(--sh-3);
}
.viewer__media>img,.viewer__media>svg{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.viewer__dots{display:flex;gap:6px}
.viewer__dots i{width:8px;height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.4)}
.viewer__dots i.on{background:#fff}
.viewer__bar{display:flex;gap:var(--s-3);align-items:center;flex-wrap:wrap;justify-content:center}
.viewer__bar .btn--ghost{background:var(--surface);box-shadow:none;color:var(--text);font-size:22px;line-height:1}
.viewer__close{
  position:absolute;top:calc(var(--s-4) + env(safe-area-inset-top));right:var(--s-4);
  width:var(--tap);height:var(--tap);border-radius:var(--r-pill);border:0;cursor:pointer;
  background:var(--surface);color:var(--text);font-size:17px;box-shadow:var(--sh-2);
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__in">
    <div class="logo">
      <span class="logo__bubble" aria-hidden="true"></span>
      <span>Just&nbsp;To&nbsp;Study</span>
      <span class="logo__sub" data-i18n="app.section">· Listen &amp; Choose</span>
    </div>
    <div class="topbar__spacer"></div>
    <button class="btn btn--icon btn--ghost" id="btnTheme" type="button" title="Theme" aria-label="Theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
    <div class="segmented" id="langSwitch" role="group" aria-label="Interface language">
      <button type="button" data-lang="kz">KZ</button>
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>

<!-- ============================ START ============================ -->
<section class="screen wrap" id="screenStart">
  <div class="hero">
    <span class="hero__badge" data-i18n="start.badge">Listening</span>
    <h1 data-i18n="start.title">Listen &amp; Choose</h1>
    <p data-i18n="start.subtitle">Listen to the description and choose the picture.</p>
  </div>

  <div class="start-grid">
    <div class="card">
      <div class="section-title" data-i18n="start.level">Level</div>
      <div class="chips" id="levelChips"></div>
    </div>
  </div>

  <div class="start-actions">
    <button class="btn btn--primary btn--lg" id="btnStart" type="button" data-i18n="start.cta">Start</button>
    <button class="btn btn--ghost btn--lg" id="btnResetProgress" type="button" data-i18n="start.reset">Reset progress</button>
  </div>
  <p class="start-note" data-i18n="start.note" style="margin-top:16px"></p>
</section>

<!-- ============================ SESSION ============================ -->
<section class="screen wrap" id="screenSession" hidden>
  <div class="session">

    <div class="session__aside">
      <div class="hud">
        <span class="hud__counter" id="hudCounter">1 / 12</span>
        <span class="hud__pill hud__pill--mode" id="hudMode">Classic</span>
        <span class="hud__pill hud__pill--streak" id="hudStreak" hidden>🔥 0</span>
        <span class="hud__pill" id="hudScore">0</span>
      </div>
      <div class="progressbar"><div class="progressbar__fill" id="hudBar"></div></div>

      <div class="audio" id="audioBox">
        <div class="audio__row">
          <button class="audio__replay" id="btnReplay" type="button" aria-label="Replay">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
          </button>
          <div class="audio__mid">
            <div class="audio__label">
              <span class="audio__wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
              <span data-i18n="audio.listen">Listen</span>
              <span class="audio__left" id="audioLeft"></span>
            </div>
            <div class="audio__track" id="audioTrack" role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
              <div class="audio__played" id="audioPlayed"></div>
            </div>
          </div>
        </div>
        <div class="audio__row" style="justify-content:space-between">
          <div class="audio__speed" id="speedSwitch" role="group" aria-label="Speed">
            <button type="button" data-rate="0.5">0.5×</button>
            <button type="button" data-rate="0.75">0.75×</button>
            <button type="button" data-rate="1">1×</button>
            <button type="button" data-rate="1.25">1.25×</button>
          </div>
          <button class="btn btn--ghost" id="btnQuit" type="button" data-i18n="session.quit">Exit</button>
        </div>
        <div class="audio__status" id="audioStatus"></div>
      </div>

      <div class="task" id="taskPrompt">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex:0 0 18px"><path d="M12 2a10 10 0 0 0-8 16l-1 4 4-1a10 10 0 1 0 5-19z"/></svg>
        <span id="taskPromptText"></span>
      </div>
    </div>

    <div class="session__main">
      <div id="stageHost"></div>
      <div class="feedback" id="feedback"><span class="feedback__txt" id="feedbackText"></span></div>
      <div class="transcript" id="transcript">
        <button class="transcript__head" id="btnTranscript" type="button" disabled aria-expanded="false">
          <span data-i18n="session.transcript">Show transcript</span>
          <svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="transcript__body" id="transcriptBody" hidden></div>
      </div>
    </div>

  </div>
</section>

<!-- ============================ RESULT ============================ -->
<section class="screen wrap" id="screenResult" hidden>
  <div class="result-head">
    <div class="score-ring" id="scoreRing"><b id="scoreValue">0</b><small data-i18n="result.points">points</small></div>
    <h1 id="resultTitle" data-i18n="result.title">Set complete</h1>
    <p id="resultSub" style="color:var(--text-2);margin:0"></p>
  </div>

  <div class="stats">
    <div class="stat"><b id="statCorrect">0</b><span data-i18n="result.correct">Correct</span></div>
    <div class="stat"><b id="statReplays">0</b><span data-i18n="result.replays">Replays used</span></div>
    <div class="stat"><b id="statSpeed">1.0×</b><span data-i18n="result.avgSpeed">Average speed</span></div>
    <div class="stat"><b id="statStreak">0</b><span data-i18n="result.bestStreak">Best streak</span></div>
  </div>

  <div class="section-title" data-i18n="result.vocab">Words from this set</div>
  <div class="wordlist" id="wordList"></div>

  <div class="result-actions">
    <button class="btn btn--primary btn--lg" id="btnNextSet" type="button" data-i18n="result.nextSet">Next set</button>
    <button class="btn btn--ghost btn--lg" id="btnRepeatMistakes" type="button" data-i18n="result.repeatMistakes">Repeat mistakes</button>
    <button class="btn btn--ghost btn--lg" id="btnHome" type="button" data-i18n="result.home" style="grid-column:1/-1">Back to start</button>
  </div>
</section>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* Turn an icon's markup into a white silhouette so it can mask the light pass. */
function whiteify(markup) {
  return markup
    .replace(/fill="(?!none)[^"]*"/g, 'fill="#fff"')
    .replace(/stroke="(?!none)[^"]*"/g, 'stroke="#fff"')
    .replace(/opacity="[^"]*"/g, 'opacity="1"');
}

/* A room drawn in perspective: wall, floor, converging boards, baseboard. */
function room(wall, floor, horizon, extra) {
  var s = '<g filter="url(#jtsDof)">' +
    '<rect width="800" height="600" fill="url(#' + wall + ')"/>' +
    '<path d="M0 ' + horizon + 'H800V600H0Z" fill="url(#' + floor + ')"/>';
  for (var i = -4; i <= 4; i++) {
    s += '<path d="M400 ' + horizon + "L" + (400 + i * 210) + ' 600" stroke="#1b1030" stroke-opacity=".05" stroke-width="3"/>';
  }
  s += '<rect y="' + (horizon - 14) + '" width="800" height="16" fill="#1b1030" fill-opacity=".07"/>' +
    '<rect y="' + horizon + '" width="800" height="22" fill="#1b1030" fill-opacity=".05"/>' +
    "</g>";
  return s + (extra || "");
}
function windowPane(x, y, w, h) {
  return '<g><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="14" fill="url(#glassG)"/>' +
    '<path d="M' + x + " " + (y + h * 0.62) + "L" + (x + w) + " " + (y + h * 0.18) + "V" + y + "H" + (x + w * 0.45) + 'Z" fill="#fff" opacity=".28"/>' +

    '<path d="M' + (x + w / 2) + " " + y + "v" + h + "M" + x + " " + (y + h / 2) + "h" + w + '" stroke="#fffaf0" stroke-width="9"/></g>';

/* Render a scene spec to an <svg> string. */
function renderScene(scene, title) {
  if (!scene) return placeholderSVG(title || "");
  ensureArtDefs();
  var uid = "s" + (++SCENE_SEQ);
  var bg = BACKDROPS[scene.bg] || BACKDROPS.plain;
  var defs = "", body = "";
  (scene.items || []).forEach(function (it, n) {
    var fn = ICONS[it.i];
    if (!fn) return;
    var raw = fn(col(it.c), it);
    var mid = uid + "_m" + n;
    var k = (it.s || 1) * 1.6;
    var px = (it.x / 100) * 800;
    var py = (it.y / 100) * 600;
    var flip = it.f ? " scale(-1,1) translate(-100,0)" : "";
    defs += '<mask id="' + mid + '" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">' +
      '<rect x="-10" y="-10" width="120" height="120" fill="#000"/>' + whiteify(raw) + "</mask>";
    body += '<g transform="translate(' + (px - 50 * k).toFixed(1) + "," + (py - 100 * k).toFixed(1) +
      ") scale(" + k.toFixed(3) + ")" + flip + '">' +
      /* contact shadow grounds the object on the floor */
      '<ellipse cx="50" cy="99" rx="34" ry="6.5" fill="#1b1030" opacity=".32" filter="url(#jtsSoft)"/>' +
      raw +
      /* one light pass, clipped to the object's own silhouette */
      '<rect x="-10" y="-10" width="120" height="120" fill="url(#jtsSheen)" mask="url(#' + mid + ')"/>' +
      '<rect x="-10" y="-10" width="120" height="120" fill="url(#jtsRim)" mask="url(#' + mid + ')"/>' +
      "</g>";
  });
  return '<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img"' +
    (title ? ' aria-label="' + escapeAttr(title) + '"' : ' aria-hidden="true"') + ">" +
    "<defs>" + defs + "</defs>" + bg() + body +
    '<rect width="800" height="600" fill="url(#jtsVig)"/></svg>';
}

function placeholderSVG(label) {
  return '<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect width="800" height="600" fill="#EFEAFB"/>' +
    '<rect x="230" y="200" width="340" height="180" rx="40" fill="#D9CDF6"/>' +
    '<path d="M300 380l-40 50 10-50z" fill="#D9CDF6"/>' +
    '<circle cx="340" cy="290" r="18" fill="#874BF8"/><circle cx="400" cy="290" r="18" fill="#874BF8"/>' +
    '<circle cx="460" cy="290" r="18" fill="#874BF8"/>' +
    (label ? '<text x="400" y="500" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#8F88A6">' +
      escapeText(label) + "</text>" : "") + "</svg>";
}

function escapeAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }
function escapeText(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

/* ---------------------------------------------------------------------
   Media resolution: local assets/ first, optional CDN second, generated
   placeholder last. Only files listed in ASSETS are ever requested, so a
   shipment without artwork produces no failed network requests at all.
   --------------------------------------------------------------------- */
var ASSETS = {
  /* audio files that really ship next to this html file */
  audio: [],
  /* illustrations that really ship next to this html file */
  image: []
};
var MEDIA = {
  cdnBase: "",   /* e.g. "https://cdn.justtostudy.kz/listen-and-choose/" */
  _a: null, _i: null,
  index: function () {
    if (this._a) return;
    this._a = {}; this._i = {};
    var self = this;
    ASSETS.audio.forEach(function (p) { self._a[p] = 1; });
    ASSETS.image.forEach(function (p) { self._i[p] = 1; });
  },
  resolve: function (path, kind) {
    if (!path) return null;
    this.index();
    var table = kind === "audio" ? this._a : this._i;
    if (table[path]) return path;
    if (this.cdnBase) return this.cdnBase + path;
    return null;
  }
};

/* Build the media node for an option: try <img> first, fall back to scene. */
function buildMedia(option) {
  var host = document.createElement("div");
  host.className = "opt__media";
  var fallback = function () {
    host.innerHTML = renderScene(option.scene, "");
  };
  var src = MEDIA.resolve(option.img, "image");
  if (src) {
    var img = new Image();
    img.alt = "";
    img.decoding = "async";
    img.loading = "lazy";
    img.addEventListener("error", fallback, { once: true });
    img.src = src;
    host.appendChild(img);
  } else {
    fallback();
  }
  return host;
}

/* ---------------------------------------------------------------------
   3. CONTENT
      One flat array, one schema — designed to be generated in batches.
      Helpers below exist for a pedagogical reason: every distractor is the
      SAME base scene with exactly ONE field changed (colour, count, place,
      object, action). A learner can never solve the item without listening.
   --------------------------------------------------------------------- */
function sc(bg, items) { return { bg: bg, items: items }; }
/* V = variant: deep-clone the base scene and apply one mutation. */
function V(base, mutate) {
  var s = JSON.parse(JSON.stringify(base));
  if (mutate) mutate(s);
  return s;
}
function o(scene, correct, hotspots) {
  return { img: null, scene: scene, correct: !!correct, hotspots: hotspots || null };
}
/* find item by icon name inside a cloned scene */
function pick(s, icon, nth) {
  var n = 0;
  for (var i = 0; i < s.items.length; i++) {
    if (s.items[i].i === icon) { if (n === (nth || 0)) return s.items[i]; n++; }
  }
  return s.items[0];
}

/* ---- the single flat content array ---- */

/* ---------------------------------------------------------------------

  get: function (k, d) {

/* ---------------------------------------------------------------------
   5. Sfx — two short, quiet, explainable cues. Nothing else ever sounds.
   --------------------------------------------------------------------- */
var Sfx = {
  ctx: null,
  ac: function () {
    if (!this.ctx) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      this.ctx = new C();
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  blip: function (freqs, gain, dur) {
    var c = this.ac();
    if (!c) return;
    var t0 = c.currentTime;
    freqs.forEach(function (f, i) {
      var osc = c.createOscillator(), g = c.createGain();
      osc.type = "sine";
      osc.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + i * 0.08);
      g.gain.linearRampToValueAtTime(gain, t0 + i * 0.08 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.08 + dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t0 + i * 0.08); osc.stop(t0 + i * 0.08 + dur + 0.02);
    });
  },
  ok: function () { this.blip([660, 880], 0.07, 0.16); },
  wrong: function () { this.blip([220], 0.05, 0.18); }

/* ---------------------------------------------------------------------
   6. AudioEngine
      - exactly one source may sound at a time
      - real file first, speechSynthesis as the guaranteed fallback
      - playbackRate + preservesPitch, seekable progress bar
   --------------------------------------------------------------------- */
var ACCENT_LANG = { US: "en-US", UK: "en-GB", AUS: "en-AU" };
var RATE_STEPS = [0.5, 0.75, 1, 1.25];

var AudioEngine = {
  el: null,
  rate: 1,
  mode: "idle",        /* idle | file | tts */
  onEnd: null,
  raf: 0,
  guard: 0,
  ttsStart: 0,
  ttsDur: 1,
  current: null,
  ui: {},

  init: function (ui) {
    this.ui = ui;
    this.el = new Audio();
    this.el.preload = "auto";
    var self = this;
    this.el.addEventListener("timeupdate", function () {
      if (self.el.duration) self.paint(self.el.currentTime / self.el.duration);
    });
    this.el.addEventListener("ended", function () { self.finish(); });
    this.el.addEventListener("error", function () { self.fileFailed(); });
    this.el.addEventListener("playing", function () { self.setBusy(true); self.status(""); });
  },

  setRate: function (r) {
    this.rate = r;
    Store.set(K_RATE, r);

      this.el.playbackRate = r;

      this.el.mozPreservesPitch = true;
      this.el.webkitPreservesPitch = true;
    } catch (e) {}
    if (this.mode === "tts" && this.current) this.play(this.current); /* restart TTS at new rate */
  },

  stop: function () {
    try { this.el.pause(); this.el.currentTime = 0; } catch (e) {}

    this.setBusy(false);
    this.paint(0);
  },

  /* spec: { src, text, accent, onEnd } */
  play: function (spec) {
    this.stop();
    this.current = spec;
    this.onEnd = spec.onEnd || null;
    if (spec.src) {
      this.mode = "file";
      this.status(t("audio.loading"));
      this.el.src = spec.src;
      this.setRate(this.rate);
      var p = this.el.play();
      if (p && p.catch) { var self = this; p.catch(function () { self.fileFailed(); }); }

      this.speak(spec);
    }
  },

  fileFailed: function () {
    if (this.mode !== "file") return;
    this.status(this.current && this.current.src ? t("audio.error") : t("audio.tts"), true);
    this.speak(this.current || {});
  },

  speak: function (spec) {
    var synth = window.speechSynthesis;
    var text = spec.text || "";
    if (!synth || !text) { this.status(t("audio.error"), true); this.finish(); return; }
    this.mode = "tts";
    if (!this.current || !this.current.src) this.status(t("audio.tts"));
    var u = new SpeechSynthesisUtterance(text);
    u.lang = ACCENT_LANG[spec.accent] || "en-US";
    u.rate = Math.max(0.1, Math.min(10, 0.9 * this.rate));
    u.pitch = 1;
    var vs = synth.getVoices() || [];
    for (var i = 0; i < vs.length; i++) {
      if (vs[i].lang && vs[i].lang.replace("_", "-").toLowerCase() === u.lang.toLowerCase()) { u.voice = vs[i]; break; }
    }
    if (!u.voice) {
      for (var j = 0; j < vs.length; j++) {
        if (vs[j].lang && vs[j].lang.toLowerCase().indexOf("en") === 0) { u.voice = vs[j]; break; }
      }
    }
    var self = this;
    u.onend = function () { self.finish(); };
    u.onerror = function () { self.finish(); };
    /* estimate duration for the progress bar: ~2.6 words per second at 1x */
    var words = text.split(/\s+/).filter(Boolean).length || 1;
    this.ttsDur = Math.max(1, words / (2.6 * this.rate));
    this.ttsStart = performance.now();
    this.setBusy(true);
    try { synth.speak(u); } catch (e) { this.finish(); return; }
    /* Watchdog: some engines never fire onend (or have no installed voice at
       all). Without it a chunked round could stall forever. */
    clearTimeout(this.guard);
    this.guard = setTimeout(function () { if (self.mode === "tts") self.finish(); },
      this.ttsDur * 1000 * 1.6 + 2500);
    var tick = function () {
      if (self.mode !== "tts") return;
      var p = (performance.now() - self.ttsStart) / 1000 / self.ttsDur;
      self.paint(Math.min(1, p));
      if (p < 1) self.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  },

  finish: function () {
    clearTimeout(this.guard);
    cancelAnimationFrame(this.raf);
    this.paint(1);
    this.mode = "idle";
    this.setBusy(false);
    var cb = this.onEnd;
    this.onEnd = null;
    if (cb) cb();
  },

  seek: function (pct) {
    if (this.mode === "file" && this.el.duration) {
      this.el.currentTime = Math.max(0, Math.min(1, pct)) * this.el.duration;
      this.paint(pct);
    }
  },

  seekable: function () { return this.mode === "file" && !!this.el.duration; },

  paint: function (p) {
    if (this.ui.played) this.ui.played.style.width = (Math.max(0, Math.min(1, p)) * 100).toFixed(1) + "%";
    if (this.ui.track) this.ui.track.setAttribute("aria-valuenow", Math.round(Math.max(0, Math.min(1, p)) * 100));
  },
  setBusy: function (on) { if (this.ui.box) this.ui.box.classList.toggle("is-playing", !!on); },
  status: function (msg, isErr) {
    if (!this.ui.status) return;
    this.ui.status.textContent = msg || "";
    this.ui.status.classList.toggle("is-error", !!isErr);
  }
};

/* ---------------------------------------------------------------------
   7. Adaptive — pure functions, unit-checked in the console.
      Three correct in a row: speed up one step, harder distractor pool.
      Two wrong in a row: speed down one step, fewer options.
   --------------------------------------------------------------------- */
function defaultRate(level) { return level === "A0" ? 0.75 : 1; }
function replayLimit(level) { return (level === "B2" || level === "C1") ? 2 : Infinity; }
function optionCap(level) {
  return { A0: 3, A1: 4, A2: 4, B1: 6, B2: 6, C1: 6 }[level] || 4;
}
function stepRate(rate, dir) {
  var i = RATE_STEPS.indexOf(rate);
  if (i < 0) i = RATE_STEPS.indexOf(1);
  return RATE_STEPS[Math.max(0, Math.min(RATE_STEPS.length - 1, i + dir))];
}
/* state: {rate, streak, wrongStreak, cap, bestStreak, hardPool} */
function adapt(state, correct) {
  var s = {
    rate: state.rate, streak: state.streak, wrongStreak: state.wrongStreak,
    cap: state.cap, bestStreak: state.bestStreak, hardPool: state.hardPool, minCap: state.minCap || 2
  };
  if (correct) {
    s.streak = state.streak + 1;
    s.wrongStreak = 0;
    if (s.streak > s.bestStreak) s.bestStreak = s.streak;
    if (s.streak % 3 === 0) { s.rate = stepRate(s.rate, +1); s.hardPool = true; }
  } else {
    s.wrongStreak = state.wrongStreak + 1;
    s.streak = 0;
    if (s.wrongStreak % 2 === 0) { s.rate = stepRate(s.rate, -1); s.cap = Math.max(s.minCap, s.cap - 1); s.hardPool = false; }
  }
  return s;
}
function freshAdaptState(level) {
  return { rate: defaultRate(level), streak: 0, wrongStreak: 0, cap: optionCap(level), bestStreak: 0, hardPool: false, minCap: 2 };
}

/* --- console unit checks for the adaptive rules --- */
function runSelfTests() {
  var fails = [];
  var ck = function (name, got, want) {
    if (JSON.stringify(got) !== JSON.stringify(want)) fails.push(name + ": got " + JSON.stringify(got) + ", want " + JSON.stringify(want));
  };
  ck("stepRate up from 0.75", stepRate(0.75, +1), 1);
  ck("stepRate clamps at top", stepRate(1.25, +1), 1.25);
  ck("stepRate clamps at bottom", stepRate(0.5, -1), 0.5);

  var s = freshAdaptState("A2");
  ck("A2 starts at 1x", s.rate, 1);
  ck("A2 cap", s.cap, 4);
  s = adapt(s, true); s = adapt(s, true);
  ck("two correct keeps rate", s.rate, 1);
  s = adapt(s, true);
  ck("three correct raises rate", s.rate, 1.25);
  ck("three correct arms hard pool", s.hardPool, true);
  ck("best streak tracked", s.bestStreak, 3);

  s = adapt(s, false);
  ck("one wrong keeps rate", s.rate, 1.25);
  ck("one wrong resets streak", s.streak, 0);
  s = adapt(s, false);
  ck("two wrong lowers rate", s.rate, 1);
  ck("two wrong narrows options", s.cap, 3);

  var low = freshAdaptState("A0");
  ck("A0 starts slower", low.rate, 0.75);
  low = adapt(low, false); low = adapt(low, false);
  ck("A0 floors at 0.5", low.rate, 0.5);
  low = adapt(low, false); low = adapt(low, false);
  ck("cap never drops below 2", low.cap, 2);

  ck("A0 replays unlimited", replayLimit("A0") === Infinity, true);
  ck("B2 replays limited", replayLimit("B2"), 2);

  /* content integrity: every round must have exactly one correct option
     (sequence rounds mark all of them, by design) */
  CONTENT.forEach(function (r) {
    var n = r.options.filter(function (x) { return x.correct; }).length;
    if (r.mode === "sequence") {
      if (n !== r.options.length) fails.push(r.id + ": sequence options must all be marked correct");
    } else if (n !== 1) {
      fails.push(r.id + ": expected 1 correct option, found " + n);
    }
    if (r.mode === "multipin" && (!r.options[0].hotspots || r.options[0].hotspots.length < 2)) {
      fails.push(r.id + ": multipin needs at least two hotspots");
    }
    if (r.mode === "pinpoint") {
      var c = r.options.filter(function (x) { return x.correct; })[0];
      if (!c.hotspots || !c.hotspots.length) fails.push(r.id + ": pinpoint needs a hotspot on the correct option");
    }
    if (r.mode === "elimination" && (!r.chunks || !r.eliminate || r.eliminate.length !== r.chunks.length)) {
      fails.push(r.id + ": elimination needs eliminate[] aligned to chunks[]");
    }
    (r.options || []).forEach(function (op) {
      (op.hotspots || []).forEach(function (h) {
        if (h.r < 8) fails.push(r.id + ": hotspot radius " + h.r + "% is below the 8% minimum");
      });
    });
    if (!r.translations || !r.translations.ru || !r.translations.kz) fails.push(r.id + ": missing translation");
  });

  /* i18n integrity: all three dictionaries must cover the same keys */
  var base = Object.keys(I18N.en);
  LANGS.forEach(function (l) {
    base.forEach(function (k) { if (I18N[l][k] === undefined) fails.push("i18n " + l + " missing key " + k); });
    Object.keys(I18N[l]).forEach(function (k) { if (I18N.en[k] === undefined) fails.push("i18n en missing key " + k); });
  });

  if (fails.length) {
    console.error("[JTS] self-tests FAILED (" + fails.length + "):");
    fails.forEach(function (f) { console.error("  · " + f); });
  } else {
    console.log("%c[JTS] self-tests passed · " + CONTENT.length + " rounds · " + LANGS.length + " languages",
      "color:#00D441;font-weight:bold");
  }
  return fails;
}

var D = {};

  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
}
function shuffle(a) {
  var r = a.slice();
  for (var i = r.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = r[i]; r[i] = r[j]; r[j] = tmp;
  }
  return r;
}
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

var App = {
  lang: "ru",
  level: "A2",
  screen: "start",
  queue: [],
  idx: 0,
  ad: null,
  log: [],
  score: 0,
  round: null,
  SESSION_SIZE: 12
};

/* ---------- content helpers ---------- */
function roundsFor(level) {
  return CONTENT.filter(function (r) { return r.level === level; });
}
/* Alternate modes so the same mode never repeats back to back. */
function alternateModes(list) {
  var pool = list.slice(), out = [], last = null;
  while (pool.length) {
    var k = -1;
    for (var i = 0; i < pool.length; i++) { if (pool[i].mode !== last) { k = i; break; } }
    if (k < 0) k = 0;
    last = pool[k].mode;
    out.push(pool.splice(k, 1)[0]);
  }
  return out;
}
function buildQueue(level, size) {
  var pool = roundsFor(level);
  if (!pool.length) return [];
  return alternateModes(shuffle(pool)).slice(0, size || App.SESSION_SIZE);
}
/* Trim distractors to the adaptive cap.
   Authoring convention: the FIRST distractors differ by a single attribute
   (hardest), later ones differ more obviously. So a "similar" pool keeps the
   front of the list, an easier pool keeps the back. */
function visibleOptions(data, cap, hardPool) {
  var opts = data.options.map(function (op, i) { return { op: op, i: i }; });
  if (data.mode === "sequence" || data.mode === "multipin" || data.mode === "truefalse") return opts;
  if (opts.length <= cap) return opts;
  var correct = opts.filter(function (x) { return x.op.correct; });
  var others = opts.filter(function (x) { return !x.op.correct; });
  var need = Math.max(1, cap - correct.length);
  var keep = hardPool ? others.slice(0, need) : others.slice(-need);
  return correct.concat(keep).sort(function (a, b) { return a.i - b.i; });
}

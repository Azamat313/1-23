<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Writing Task 2 — Problem–Solution &amp; Double Question (Band 8)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#2f6bff; --accent-dark:#1c4fd0; --accent-soft:#eaf0ff;
  --ink:#16202f; --muted:#64748b; --line:#e3e8f0; --bg:#f4f6fb; --card:#ffffff;
  --ok:#16a34a; --ok-bg:#e8f7ee; --bad:#dc2626; --bad-bg:#fdecec; --warn:#d97706; --warn-bg:#fff5e6;
  --c-topic:#1d4ed8; --c-topic-bg:#e6edff;
  --c-expl:#7c3aed; --c-expl-bg:#f1e9ff;
  --c-ex:#ea580c;  --c-ex-bg:#ffeede;
  --c-res:#15803d; --c-res-bg:#e4f7ea;
  --c-para:#0f766e; --c-para-bg:#dff5f2;
  --c-out:#4338ca;  --c-out-bg:#e8e8ff;
  --c-conc:#0e7490; --c-conc-bg:#def3f9;
  --c-conc2:#be185d; --c-conc2-bg:#fde7f1;
  --radius:14px; --shadow:0 1px 2px rgba(16,32,60,.05),0 8px 24px rgba(16,32,60,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
p{margin:0 0 .8em}
button{font-family:inherit;font-size:1rem}
a{color:var(--accent)}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40; background:rgba(255,255,255,.95);
  backdrop-filter:saturate(180%) blur(8px); border-bottom:1px solid var(--line);
}
.hbar{display:flex; align-items:center; gap:12px; padding:10px 18px; max-width:1360px; margin:0 auto}
.brand{font-weight:700; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.hspace{flex:1}
.langs{display:flex; gap:4px; background:#eef1f7; padding:3px; border-radius:999px}
.langs button{
  border:0; background:transparent; padding:8px 12px; border-radius:999px; cursor:pointer;
  font-weight:600; font-size:.82rem; color:var(--muted); min-height:34px;
}
.langs button.on{background:#fff; color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.progwrap{padding:0 18px 10px; max-width:1360px; margin:0 auto}
.progbar{height:8px; background:#e6eaf2; border-radius:999px; overflow:hidden}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#6f9bff);width:0;transition:width .35s ease}
.proglabel{font-size:.74rem;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
#menuBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;min-width:44px;min-height:44px;cursor:pointer}

/* ---------- layout ---------- */
.shell{display:grid; grid-template-columns:282px 1fr; gap:22px; max-width:1360px; margin:0 auto; padding:20px 18px 120px}
nav.side{position:sticky; top:104px; align-self:start; max-height:calc(100vh - 130px); overflow:auto}
.modblock{margin-bottom:14px}
.modtitle{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 6px 10px}
.steplink{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:0; background:transparent;
  padding:9px 10px; border-radius:10px; cursor:pointer; color:var(--ink); font-size:.86rem; min-height:40px;
}
.steplink:hover{background:#eaeef6}
.steplink.on{background:var(--accent-soft); color:var(--accent-dark); font-weight:600}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:.66rem;color:#fff}
.steplink.done .dot{background:var(--ok);border-color:var(--ok)}
.steplink.on .dot{border-color:var(--accent)}
main{min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:1040px){
  #menuBtn{display:block}
  .shell{grid-template-columns:1fr; padding-bottom:96px}
  nav.side{position:fixed; inset:0 auto 0 0; width:84%; max-width:320px; background:#fff; z-index:60;
    transform:translateX(-102%); transition:transform .25s ease; padding:14px; max-height:none; box-shadow:var(--shadow); overflow:auto}
  nav.side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:55;display:none}
  .scrim.on{display:block}
  #sideClose{display:flex !important}
  .two{grid-template-columns:1fr}
}

/* ---------- cards ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:16px}
.card.tight{padding:14px}
.kicker{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
.note{background:var(--accent-soft);border:1px solid #d3e0ff;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.92rem}
.rule{background:#fff8e6;border:1px solid #f4dfae;border-left:5px solid var(--warn);border-radius:12px;padding:12px 14px;margin:12px 0}
.rule b{color:#8a5a06}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.tasktext{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px 14px;font-size:.95rem}
ul.tick{list-style:none;padding-left:0;margin:.4em 0}
ul.tick li{padding-left:24px;position:relative;margin-bottom:6px}
ul.tick li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:700}

/* ---------- buttons ---------- */
.btn{
  border:0; background:var(--accent); color:#fff; padding:11px 18px; border-radius:11px; cursor:pointer;
  font-weight:600; min-height:44px; box-shadow:0 1px 2px rgba(16,32,60,.12)
}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:#f1f4fa}
.btn.soft{background:var(--accent-soft);color:var(--accent-dark);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted);min-height:40px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- feedback ---------- */
.fb{margin-top:12px;border-radius:12px;padding:11px 13px;font-size:.9rem;display:none}
.fb.show{display:block}
.fb.good{background:var(--ok-bg);border:1px solid #b7e6c7;color:#14532d}
.fb.bad{background:var(--bad-bg);border:1px solid #f6c4c4;color:#7f1d1d}
.fb.info{background:var(--accent-soft);border:1px solid #d3e0ff;color:#1e3a8a}

/* ---------- essay colour coding ---------- */
.s{border-radius:6px;padding:1px 2px}
.cc .r-topic,.cc .r-cause,.cc .r-problem,.cc .r-solution,.cc .r-position{background:var(--c-topic-bg);color:var(--c-topic)}
.cc .r-explanation{background:var(--c-expl-bg);color:var(--c-expl)}
.cc .r-example{background:var(--c-ex-bg);color:var(--c-ex)}
.cc .r-result{background:var(--c-res-bg);color:var(--c-res)}
.cc .r-paraphrase{background:var(--c-para-bg);color:var(--c-para)}
.cc .r-outline{background:var(--c-out-bg);color:var(--c-out)}
.cc .r-conclusion{background:var(--c-conc-bg);color:var(--c-conc)}
.cc .r-concession{background:var(--c-conc2-bg);color:var(--c-conc2)}
.cc .r-solutionOpen{background:var(--c-out-bg);color:var(--c-out)}
.lnk{font-weight:700;text-decoration:underline;text-underline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.legend span{font-size:.75rem;border-radius:999px;padding:4px 10px;font-weight:600}
.essay p{margin-bottom:.9em}

/* ---------- generic exercise widgets ---------- */
.chip{
  border:1px solid var(--line); background:#fff; border-radius:11px; padding:10px 12px; cursor:pointer;
  font-size:.9rem; min-height:44px; display:flex; align-items:center; text-align:left; width:100%;
}
.chip:hover{border-color:var(--accent)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.good{border-color:var(--ok);background:var(--ok-bg)}
.chip.bad{border-color:var(--bad);background:var(--bad-bg)}
.chip.used{opacity:.45;pointer-events:none}
.pool{display:flex;flex-direction:column;gap:8px}
.boxes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media(max-width:640px){.boxes{grid-template-columns:1fr}}
.box{border:2px dashed #cbd5e1;border-radius:12px;padding:10px;min-height:96px;background:#fbfcfe}
.box.hot{border-color:var(--accent);background:var(--accent-soft)}
.box h4{font-size:.84rem;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.box .chip{margin-bottom:6px}
.wordline{line-height:2.3;font-size:1rem}
.w{cursor:pointer;border-radius:6px;padding:2px 3px;border-bottom:2px solid transparent}
.w:hover{background:#eef2ff}
.w.sel{background:#fde68a;border-bottom-color:#d97706}
.w.good{background:var(--ok-bg);border-bottom-color:var(--ok)}
.w.bad{background:var(--bad-bg);border-bottom-color:var(--bad)}
.w.miss{outline:2px dashed var(--bad);outline-offset:1px}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.matchgrid{grid-template-columns:1fr}}
.pairline{font-size:.8rem;color:var(--muted);margin-top:2px}
select.gap{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.92rem;min-height:38px;background:#fff;font-family:inherit}
select.gap.good{border-color:var(--ok);background:var(--ok-bg)}
select.gap.bad{border-color:var(--bad);background:var(--bad-bg)}
input.gapin{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.92rem;min-height:38px;font-family:inherit;min-width:150px}
input.gapin.good{border-color:var(--ok);background:var(--ok-bg)}
input.gapin.bad{border-color:var(--bad);background:var(--bad-bg)}
textarea{
  width:100%; border:1px solid var(--line); border-radius:12px; padding:12px; font-family:inherit;
  font-size:.96rem; line-height:1.6; resize:vertical; background:#fff;
}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.counter{font-size:.78rem;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.counter b{color:var(--ink)}
.counter .okc{color:var(--ok)}
.counter .badc{color:var(--bad)}
.score{font-size:.82rem;font-weight:600;color:var(--muted)}
.tmpl{background:#f8fafc;border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px;font-size:.9rem;margin:8px 0}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t td,table.t th{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
table.t th{background:#f5f7fb;font-weight:600}
.mapblock{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:#fff}
.mapblock>button{width:100%;text-align:left;border:0;background:#fff;padding:13px 14px;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center;min-height:48px}
.mapblock>button:hover{background:#f6f8fc}
.mapblock .body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.mapblock.open .body{display:block}
.mapblock .num{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center;font-size:.8rem;flex:0 0 auto}
.flip{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;margin-bottom:10px}
.flip>button{width:100%;text-align:left;border:0;background:#fff;padding:13px 14px;cursor:pointer;font-weight:600;min-height:48px}
.flip .body{display:none;padding:0 14px 14px}
.flip.open .body{display:block}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media(max-width:640px){.vs{grid-template-columns:1fr}}
.vs div{border-radius:10px;padding:10px;font-size:.88rem}
.vs .b6{background:var(--bad-bg);border:1px solid #f6c4c4}
.vs .b8{background:var(--ok-bg);border:1px solid #b7e6c7}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem}
.timer.low{color:var(--bad)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.cmp{grid-template-columns:1fr}}
.sim-g{background:var(--ok-bg);border-left:4px solid var(--ok);padding:4px 8px;border-radius:6px;margin-bottom:5px;font-size:.87rem}
.sim-y{background:var(--warn-bg);border-left:4px solid var(--warn);padding:4px 8px;border-radius:6px;margin-bottom:5px;font-size:.87rem}
.sim-r{background:var(--bad-bg);border-left:4px solid var(--bad);padding:4px 8px;border-radius:6px;margin-bottom:5px;font-size:.87rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--accent)}
.stat span{font-size:.76rem;color:var(--muted)}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:9px;border-radius:10px;cursor:pointer;font-size:.9rem;min-height:44px}
label.chk:hover{background:#f6f8fc}
label.chk input{margin-top:4px;width:18px;height:18px;flex:0 0 auto}
.footnav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.96);border-top:1px solid var(--line);
  padding:10px 18px; display:flex; gap:10px; align-items:center; backdrop-filter:blur(8px)
}
.footnav .sp{flex:1;font-size:.8rem;color:var(--muted)}
@media(min-width:1041px){.footnav{padding-left:calc(50% - 680px + 18px);padding-right:calc(50% - 680px + 18px)}}
#sideClose{display:none;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);
  background:#fff;border-radius:11px;padding:10px 12px;margin-bottom:12px;min-height:44px;cursor:pointer;font-weight:600}
.hide{display:none !important}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <button id="menuBtn" aria-label="Menu">☰</button>
    <div class="brand">IELTS Writing Task 2 — Band 8<small id="brandSub">Problem–Solution &amp; Double Question</small></div>
    <div class="hspace"></div>
    <div class="langs" id="langs">
      <button data-lang="ru">RU</button><button data-lang="kz">KZ</button><button data-lang="en">EN</button>
    </div>
  </div>
  <div class="progwrap">
    <div class="progbar"><i id="progFill"></i></div>
    <div class="proglabel"><span id="progText">0%</span><span id="stepText"></span></div>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main id="content"></main>
</div>
<div class="footnav">
  <button class="btn ghost" id="prevBtn">←</button>
  <div class="sp" id="footInfo"></div>
  <button class="btn" id="nextBtn">Next →</button>
</div>
<script>
"use strict";
/* =========================================================================
   1. STATE + STORAGE
   ========================================================================= */
var state = {
  lang: 'ru',
  screen: 0,
  done: {},
  ex: {},            /* exerciseId -> {correct:n, total:n} */
  essays: {},        /* key -> text */
  builder: {},       /* track -> {stepIndex: sentence} */
  track: 'cs'
};

function save(){
  try{ localStorage.setItem('ielts_w2_pd', JSON.stringify(state)); }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem('ielts_w2_pd');
    if(raw){ var o = JSON.parse(raw); for(var k in o){ if(o.hasOwnProperty(k)) state[k]=o[k]; } }
  }catch(e){}
}

/* =========================================================================
   2. I18N — L({en,ru,kz}) or L('plain string')
   ========================================================================= */
function L(x){
  if(x===null||x===undefined) return '';
  if(typeof x === 'string') return x;
  return x[state.lang] || x.en || '';
}
/* reusable "why" explanations */
var WHY = {
  informal:{en:'Band 8 needs formal academic words: "children", not "kids"; "a large number of", not "a lot of".',
            ru:'Для Band 8 нужен формальный академический стиль: "children", а не "kids"; "a large number of", а не "a lot of".',
            kz:'Band 8 үшін ресми академиялық стиль керек: "kids" емес "children"; "a lot of" емес "a large number of".'},
  repeat:{en:'Repeating the words of the task lowers Lexical Resource. Paraphrase instead.',
          ru:'Копирование слов задания снижает Lexical Resource. Нужен перефраз.',
          kz:'Тапсырманың сөздерін көшіру Lexical Resource баллын төмендетеді. Перефраз жаса.'},
  redundant:{en:'"In my opinion I think" says the same thing twice. Choose one.',
             ru:'"In my opinion I think" — это повтор одной мысли. Оставь что-то одно.',
             kz:'"In my opinion I think" — бір ойды екі рет қайталау. Біреуін ғана қалдыр.'},
  grammar:{en:'Grammar error (article, verb form or agreement). Band 8 needs mostly error-free sentences.',
           ru:'Грамматическая ошибка (артикль, форма глагола или согласование). Band 8 = почти без ошибок.',
           kz:'Грамматикалық қате (артикль, етістік формасы немесе келісім). Band 8 — қатесі жоқ сөйлемдер.'},
  linker:{en:'The linking word must match the logic: cause, addition, result or contrast.',
          ru:'Связка должна соответствовать логике: причина, добавление, результат или противопоставление.',
          kz:'Байланыстырушы сөз логикаға сай болуы керек: себеп, қосу, нәтиже немесе қарсылық.'},
  cause:{en:'A CAUSE explains WHY the situation happens (what people do).',
         ru:'ПРИЧИНА (cause) объясняет, ПОЧЕМУ ситуация возникает (что делают люди).',
         kz:'СЕБЕП (cause) жағдайдың НЕЛІКТЕН болатынын түсіндіреді (адамдар не істейді).'},
  problem:{en:'A PROBLEM / EFFECT is the bad RESULT that the situation produces.',
           ru:'ПРОБЛЕМА / ПОСЛЕДСТВИЕ (problem/effect) — это плохой РЕЗУЛЬТАТ ситуации.',
           kz:'МӘСЕЛЕ / САЛДАР (problem/effect) — жағдайдың жаман НӘТИЖЕСІ.'},
  bothQ:{en:'Answer ALL parts of the task. One missing part = Task Response max Band 5–6.',
         ru:'Отвечай на ВСЕ части задания. Пропустил часть — Task Response максимум Band 5–6.',
         kz:'Тапсырманың БАРЛЫҚ бөлігіне жауап бер. Бір бөлігі жоқ болса — Task Response ең көбі Band 5–6.'},
  vague:{en:'Too general. Band 8 uses precise topic vocabulary and a concrete example.',
         ru:'Слишком общо. Band 8 = точная тематическая лексика и конкретный пример.',
         kz:'Тым жалпы. Band 8 — нақты тақырыптық лексика және нақты мысал.'},
  match:{en:'Each solution must answer a cause/problem you wrote in Body 1 — that is Coherence.',
         ru:'Каждое решение должно отвечать причине/проблеме из Body 1 — это Coherence.',
         kz:'Әр шешім Body 1-дегі себеп/мәселеге жауап беруі керек — бұл Coherence.'}
};
function why(x){ return (typeof x==='string' && WHY[x]) ? L(WHY[x]) : L(x); }

/* UI strings used in many places */
var UI = {
  check:{en:'Check',ru:'Проверить',kz:'Тексеру'},
  again:{en:'Try again',ru:'Ещё раз',kz:'Қайта'},
  show:{en:'Show answer',ru:'Показать ответ',kz:'Жауапты көрсету'},
  next:{en:'Next →',ru:'Далее →',kz:'Келесі →'},
  finish:{en:'Finish ✓',ru:'Завершить ✓',kz:'Аяқтау ✓'},
  correct:{en:'Correct!',ru:'Верно!',kz:'Дұрыс!'},
  notyet:{en:'Not yet — look at the highlighted items.',ru:'Пока не всё верно — посмотри на выделенные ответы.',kz:'Әлі толық емес — белгіленгендерді қара.'},
  words:{en:'words',ru:'слов',kz:'сөз'},

   3. SMALL HELPERS
   ========================================================================= */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function countWords(t){ t=(t||'').trim(); if(!t) return 0; return t.split(/\s+/).length; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function norm(s){ return String(s).toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim(); }
function el(tag, cls, html){ var d=document.createElement(tag); if(cls) d.className=cls; if(html!==undefined) d.innerHTML=html; return d; }
function qs(root,sel){ return root.querySelector(sel); }
function qsa(root,sel){ return Array.prototype.slice.call(root.querySelectorAll(sel)); }

/* linking words used across the app (longest first when matching) */
var LINKERS = [
  'To address this issue','This is mainly because','This is largely because','In recent years','In conclusion',
  'On the other hand','As a result','For example','For instance','In addition','In my opinion','Furthermore',
  'Consequently','Additionally','Nevertheless','Admittedly','Similarly','Therefore','Moreover','However',
  'Overall','Firstly','Secondly','Finally','Nowadays','Because of this','provided that','Thus','Hence',
  'This is because','which means that','due to','such as'
];
var LINKER_RE = new RegExp('(' + LINKERS.slice().sort(function(a,b){return b.length-a.length;})
  .map(function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|') + ')','gi');

function markLinkers(text){
  return esc(text).replace(LINKER_RE, function(m){ return '<b class="lnk">'+m+'</b>'; });
}
function countLinkers(text){
  var m = String(text).match(LINKER_RE);
  if(!m) return 0;
  var set = {}; m.forEach(function(x){ set[x.toLowerCase()]=1; });
  return Object.keys(set).length;
}

function exFrame(host, cfg){
  var wrap = el('div','card');
  var head = '<div class="kicker">'+esc(cfg.no||'')+'</div><h3>'+L(cfg.title)+'</h3>';
  if(cfg.instr) head += '<p class="small muted">'+L(cfg.instr)+'</p>';
  wrap.innerHTML = head;
  var body = el('div','exbody'); wrap.appendChild(body);
  var fb = el('div','fb'); 
  var row = el('div','btnrow');
  wrap.appendChild(row); wrap.appendChild(fb);
  host.appendChild(wrap);
  var api = {
    wrap:wrap, body:body, fb:fb, row:row,
    btn:function(label, cls, fn){ var b=el('button','btn '+(cls||''),label); b.onclick=fn; row.appendChild(b); return b; },
    say:function(kind, msg){ fb.className='fb show '+kind; fb.innerHTML=msg; },
    clear:function(){ fb.className='fb'; fb.innerHTML=''; },
    result:function(c,t,note){
      record(cfg.id, c, t);
      var ok = c===t;
      api.say(ok?'good':'bad', '<b>'+(ok?U('correct'):U('notyet'))+'</b> '+U('score')+': '+c+'/'+t + (note?('<br>'+note):''));
    }
  };
  return api;
}

/* ---------- 5.1 sorting (drag & drop + tap) ---------- */
function sortEx(host, cfg){
  var f = exFrame(host, cfg);
  var sel = null, placed = {};
  f.body.innerHTML = '<p class="small muted">'+U('tapHint')+'</p>';
  var pool = el('div','pool'); f.body.appendChild(pool);
  var boxes = el('div','boxes'); boxes.style.gridTemplateColumns = cfg.boxes.length>2 ? '' : 'repeat(2,1fr)';
  f.body.appendChild(boxes);
  var boxEls = {};
  cfg.boxes.forEach(function(b){
    var d = el('div','box','<h4>'+L(b.label)+'</h4>');
    d.dataset.key = b.key;
    d.addEventListener('dragover', function(e){ e.preventDefault(); d.classList.add('hot'); });
    d.addEventListener('dragleave', function(){ d.classList.remove('hot'); });
    d.addEventListener('drop', function(e){ e.preventDefault(); d.classList.remove('hot');
      var id = e.dataTransfer.getData('text/plain'); var c = qs(f.body,'[data-item="'+id+'"]'); if(c) place(c,d); });
    d.onclick = function(){ if(sel){ place(sel,d); } };
    boxes.appendChild(d); boxEls[b.key]=d;
  });
  function place(chip, box){
    box.appendChild(chip); placed[chip.dataset.item]=box.dataset.key;
    chip.classList.remove('sel'); sel=null;
  }
  shuffle(cfg.items).forEach(function(it,i){
    var c = el('button','chip', esc(L(it.t)));
    c.dataset.item = it.k+'_'+i; c.dataset.key = it.k; c.draggable = true;
    c.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', c.dataset.item); });
    c.onclick = function(e){
      e.stopPropagation();
      if(sel===c){ c.classList.remove('sel'); sel=null; return; }
      if(sel) sel.classList.remove('sel');
      sel = c; c.classList.add('sel');
    };
    pool.appendChild(c);
  });
  f.btn(U('check'),'',function(){
    var chips = qsa(f.body,'.chip'), c=0;
    chips.forEach(function(ch){
      ch.classList.remove('good','bad');
      var inBox = ch.parentNode.classList.contains('box');
      if(inBox && ch.parentNode.dataset.key===ch.dataset.key){ ch.classList.add('good'); c++; }
      else if(inBox){ ch.classList.add('bad'); }
    });
    f.result(c, cfg.items.length, cfg.why?why(cfg.why):'');
  });
  f.btn(U('again'),'ghost',function(){
    qsa(f.body,'.chip').forEach(function(ch){ ch.classList.remove('good','bad','sel'); pool.appendChild(ch); });
    placed={}; sel=null; f.clear();
  });
  f.btn(U('show'),'ghost',function(){
    qsa(f.body,'.chip').forEach(function(ch){ ch.classList.remove('bad'); ch.classList.add('good'); boxEls[ch.dataset.key].appendChild(ch); });
    f.say('info', cfg.why?why(cfg.why):L({en:'These are the correct groups.',ru:'Это правильные группы.',kz:'Дұрыс топтар осы.'}));
  });
}

/* ---------- 5.8 word counter ---------- */
function attachCounter(ta, node, min, max){
  function upd(){
    var n = countWords(ta.value);
    var cls = '';
    if(min){ cls = (n>=min && (!max || n<=max+40)) ? 'okc' : 'badc'; }
    node.innerHTML = '<span class="'+cls+'"><b>'+n+'</b> '+U('words')+'</span>' +
      (min? '<span class="muted">'+(max?(min+'–'+max):('min '+min))+'</span>':'') +
      '<span class="muted">'+U('linkersUsed')+': <b>'+countLinkers(ta.value)+'</b></span>';
  }
  ta.addEventListener('input', upd); upd();
  return upd;
}

/* ---------- 5.9 accordion / flip cards ---------- */
function accordion(host, items){
  items.forEach(function(it){
    var d = el('div','flip');
    var b = el('button', '', L(it.h));
    var body = el('div','body', L(it.b));
    b.onclick = function(){ d.classList.toggle('open'); };
    d.appendChild(b); d.appendChild(body); host.appendChild(d);
  });
}

  });

  var html = '';

function linkerHuntEx(host, tr){
  var f = exFrame(host, {
    id:'ex4.2_'+tr, no:'Exercise 4.2',
    title:{en:'Find the linking words',ru:'Найди слова-связки',kz:'Байланыстырушы сөздерді тап'},
    instr:{en:'Click every linking word or phrase in the essay.',ru:'Нажми на каждое слово-связку в эссе.',kz:'Эсседегі әр байланыстырушы сөзді бас.'}
  });
  var total = 0;
  var wrap = el('div','card tight essay');
  TRACKS[tr].paras.forEach(function(p){
    var text = p.map(function(s){return s.t;}).join(' ');
    var para = el('p'); para.style.lineHeight='2.2';
    var idx = 0, m;
    LINKER_RE.lastIndex = 0;
    var parts = [];
    while((m = LINKER_RE.exec(text))!==null){
      if(m.index>idx) parts.push({t:text.slice(idx,m.index), k:false});
      parts.push({t:m[0], k:true}); total++;
      idx = m.index + m[0].length;
    }
    if(idx<text.length) parts.push({t:text.slice(idx), k:false});
    parts.forEach(function(pt){
      if(pt.k){
        var s = el('span','w', esc(pt.t)); s.dataset.k='1';
        s.onclick=function(){ s.classList.toggle('sel'); upd(); };
        para.appendChild(s);
      } else {
        pt.t.split(/(\s+)/).forEach(function(tok){
          if(/^\s+$/.test(tok)){ para.appendChild(document.createTextNode(tok)); return; }
          if(!tok) return;
          var s = el('span','w', esc(tok)); s.dataset.k='0';
          s.onclick=function(){ s.classList.toggle('sel'); upd(); };
          para.appendChild(s);
        });
      }
    });
    wrap.appendChild(para);
  });
  var counter = el('div','score');
  f.body.appendChild(counter); f.body.appendChild(wrap);
  function upd(){
    var found = qsa(wrap,'.w.sel[data-k="1"]').length;
    counter.textContent = U('found')+' '+found+' '+U('of')+' '+total;
  }
  upd();
  f.btn(U('check'),'',function(){
    var c=0;
    qsa(wrap,'.w').forEach(function(s){
      s.classList.remove('good','bad','miss');
      if(s.dataset.k==='1' && s.classList.contains('sel')){ s.classList.add('good'); c++; }
      else if(s.dataset.k==='1'){ s.classList.add('miss'); }
      else if(s.classList.contains('sel')){ s.classList.add('bad'); }
    });
    f.result(c, total, L({en:'Band 8 uses a wide range of linkers — and never starts three sentences in a row with the same one.',
                          ru:'Band 8 использует разные связки — и никогда не начинает три предложения подряд одинаково.',
                          kz:'Band 8 әртүрлі байланыстырушыларды қолданады — үш сөйлемді қатарынан бірдей бастамайды.'}));
  });
  f.btn(U('again'),'ghost',function(){ qsa(wrap,'.w').forEach(function(s){ s.className='w'; }); upd(); f.clear(); });
  f.btn(U('show'),'ghost',function(){
    qsa(wrap,'.w').forEach(function(s){ s.className='w'+(s.dataset.k==='1'?' good sel':''); }); upd();
  });
}

function autoChunk(sentence){
  var w = sentence.split(/\s+/), out=[], cur=[];
  for(var i=0;i<w.length;i++){
    cur.push(w[i]);
    var endsComma = /,$/.test(w[i]);
    if(cur.length>=3 && (endsComma || cur.length>=4)){ out.push(cur.join(' ')); cur=[]; }
  }
  if(cur.length){ if(cur.length===1 && out.length){ out[out.length-1]+=' '+cur[0]; } else out.push(cur.join(' ')); }
  return out;
}

function builderScreen(host, tr){
  var data = BUILD[tr];
  if(!state.builder[tr]) state.builder[tr] = {};
  var idx = 0;
  var head = el('div','card');
  head.innerHTML = '<div class="kicker">Module 5 · '+esc(L(TRACKS[tr].name))+'</div>'+
    '<h3>'+L({en:'Guided builder — a new task',ru:'Конструктор — новое задание',kz:'Құрастырушы — жаңа тапсырма'})+'</h3>'+
    '<div class="tasktext">'+esc(data.task)+'</div>';
  host.appendChild(head);
  var box = el('div'); host.appendChild(box);

  function draw(){
    var st = data.steps[idx];
    box.innerHTML = '';
    var c = el('div','card');
    c.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'+
      '<b>'+L({en:'Sentence',ru:'Предложение',kz:'Сөйлем'})+' '+(idx+1)+' / '+data.steps.length+'</b>'+
      '<span class="score">'+L(ROLE_LABEL[st.r])+'</span></div>'+
      '<div class="tmpl">'+st.tmpl+'</div>'+
      '<p class="small muted">💡 '+L(st.hint)+'</p>';
    box.appendChild(c);

    var modes = el('div','tabs');
    var area = el('div');
    c.appendChild(modes); c.appendChild(area);
    var MODES = [
      {k:'choose', n:{en:'1 · Choose',ru:'1 · Выбери',kz:'1 · Таңда'}},
      {k:'order',  n:{en:'2 · Order',ru:'2 · Собери',kz:'2 · Құрастыр'}},
      {k:'write',  n:{en:'3 · Write your own',ru:'3 · Напиши сам',kz:'3 · Өзің жаз'}}
    ];
    function setMode(k){
      qsa(modes,'.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.k===k); });
      area.innerHTML='';
      if(k==='choose') modeChoose(area, st);
      if(k==='order')  modeOrder(area, st);
      if(k==='write')  modeWrite(area, st);
    }
    MODES.forEach(function(m){
      var b = el('button','tab', L(m.n)); b.dataset.k=m.k;
      b.onclick=function(){ setMode(m.k); };
      modes.appendChild(b);
    });
    setMode('choose');

    var nav = el('div','btnrow');
    var prev = el('button','btn ghost','← '+L({en:'Previous',ru:'Назад',kz:'Артқа'}));
    prev.disabled = idx===0; prev.onclick=function(){ idx--; draw(); };
    var next = el('button','btn', L({en:'Next sentence →',ru:'Следующее →',kz:'Келесі →'}));
    next.disabled = idx===data.steps.length-1; next.onclick=function(){ idx++; draw(); };
    nav.appendChild(prev); nav.appendChild(next);
    box.appendChild(nav);
  }

  function modeChoose(area, st){
    var opts = shuffle([{t:st.m, ok:true}, {t:st.b5, ok:false, why:st.w5}, {t:st.b6, ok:false, why:st.w6}]);
    var pool = el('div','pool'); area.appendChild(pool);
    var fb = el('div','fb'); area.appendChild(fb);
    opts.forEach(function(o){
      var b = el('button','chip', esc(o.t));
      b.onclick = function(){
        b.classList.add(o.ok?'good':'bad');
        fb.className='fb show '+(o.ok?'good':'bad');
        fb.innerHTML = o.ok
          ? '<b>Band 8 ✓</b> — '+L({en:'clear structure, precise vocabulary, correct linker.',ru:'ясная структура, точная лексика, правильная связка.',kz:'анық құрылым, нақты лексика, дұрыс байланыстырушы.'})
          : '✗ '+why(o.why);
        record('ex5.choose_'+tr, o.ok?1:0, 1);
      };
      pool.appendChild(b);
    });
  }

  function modeOrder(area, st){
    var chunks = autoChunk(st.m);
    var line = el('div','card tight'); line.style.minHeight='56px';
    var pool = el('div','pool'); pool.style.marginTop='10px';
    var answer = [];
    function redrawLine(){
      line.innerHTML = answer.length ? '' : '<span class="muted small">'+L({en:'Tap the chunks in the right order…',ru:'Нажимай на кусочки в правильном порядке…',kz:'Бөліктерді дұрыс ретпен бас…'})+'</span>';
      answer.forEach(function(ci,pos){
        var s = el('button','chip', esc(chunks[ci]));
        s.style.display='inline-flex'; s.style.width='auto'; s.style.margin='0 6px 6px 0';
        s.onclick = function(){ answer.splice(pos,1); redraw(); };
        line.appendChild(s);
      });
    }
    function redraw(){
      redrawLine();
      qsa(pool,'.chip').forEach(function(b,i){ b.classList.toggle('used', answer.indexOf(i)>=0); });
    }
    shuffle(chunks.map(function(c,i){return i;})).forEach(function(i){
      var b = el('button','chip', esc(chunks[i]));
      b.dataset.i = i;
      b.onclick = function(){ if(answer.indexOf(i)<0){ answer.push(i); redraw(); } };
      pool.appendChild(b);
    });
    /* keep pool order stable but data index correct */
    qsa(pool,'.chip').forEach(function(b){ b.onclick = (function(ix){ return function(){ if(answer.indexOf(ix)<0){ answer.push(ix); redraw(); } }; })(+b.dataset.i); });
    area.appendChild(line); area.appendChild(pool);
    var fb = el('div','fb'); area.appendChild(fb);
    var row = el('div','btnrow'); area.appendChild(row);
    var check = el('button','btn', U('check'));
    check.onclick = function(){
      var ok = answer.length===chunks.length && answer.every(function(v,i){ return v===i; });
      fb.className='fb show '+(ok?'good':'bad');
      fb.innerHTML = ok ? '<b>'+U('correct')+'</b>' : (U('notyet')+'<br><span class="small">'+L({en:'Tip: the linking word always comes first.',ru:'Подсказка: связка всегда идёт первой.',kz:'Кеңес: байланыстырушы әрқашан бірінші тұрады.'})+'</span>');
      record('ex5.order_'+tr, ok?1:0, 1);
    };
    var reset = el('button','btn ghost', U('reset'));
    reset.onclick = function(){ answer=[]; redraw(); fb.className='fb'; };
    var showb = el('button','btn ghost', U('show'));
    showb.onclick = function(){ answer = chunks.map(function(c,i){return i;}); redraw(); fb.className='fb show info'; fb.innerHTML = markLinkers(st.m); };
    row.appendChild(check); row.appendChild(reset); row.appendChild(showb);
    redraw();
  }

  function modeWrite(area, st){
    var ta = el('textarea'); ta.rows=3;
    ta.placeholder = L({en:'Write your own version of this sentence…',ru:'Напиши свою версию этого предложения…',kz:'Осы сөйлемнің өз нұсқаңды жаз…'});
    ta.value = state.builder[tr][idx] || '';
    area.appendChild(ta);
    var cnt = el('div','counter'); area.appendChild(cnt);
    attachCounter(ta, cnt);
    ta.addEventListener('input', function(){ state.builder[tr][idx] = ta.value; save(); });
    var list = el('div');
    [{en:'I used the template',ru:'Я использовал(а) шаблон',kz:'Шаблонды қолдандым'},
     {en:'I used topic vocabulary',ru:'Я использовал(а) тематическую лексику',kz:'Тақырыптық лексиканы қолдандым'},
     {en:'My linking word is correct',ru:'Моя связка выбрана верно',kz:'Байланыстырушым дұрыс'}].forEach(function(x){
      var l = el('label','chk','<input type="checkbox"><span>'+L(x)+'</span>');
      list.appendChild(l);
    });
    area.appendChild(list);
    var cmp = el('div','fb'); area.appendChild(cmp);
    var row = el('div','btnrow'); area.appendChild(row);
    var b = el('button','btn', L({en:'Compare with the model',ru:'Сравнить с образцом',kz:'Үлгімен салыстыру'}));
    b.onclick = function(){
      cmp.className='fb show info';
      cmp.innerHTML = '<div class="cmp"><div><b>'+U('yourAnswer')+'</b><div class="card tight">'+(esc(ta.value)||'<span class="muted">—</span>')+'</div></div>'+
        '<div><b>'+U('model')+'</b><div class="card tight">'+markLinkers(st.m)+'</div></div></div>';
      record('ex5.write_'+tr, 1, 1);
    };
    row.appendChild(b);
  }
  draw();
}

var STOP = ['this','that','with','from','they','their','them','have','has','had','been','were','was','are','is',
            'and','but','the','for','not','who','which','more','most','than','also','such','into','some','many',
            'because','would','could','should','will','can','a','an','of','to','in','on','at','it','its','as','by'];
function contentWords(s){
  return norm(s).split(' ').filter(function(w){ return w.length>3 && STOP.indexOf(w)<0; });
}
function splitSentences(t){
  var m = String(t||'').replace(/\s+/g,' ').match(/[^.!?]+[.!?]*/g) || [];
  return m.map(function(s){return s.trim();}).filter(function(s){return s.length>3;});
}
function bestOverlap(modelSent, studentSents){
  var a = contentWords(modelSent); if(!a.length) return 0;
  var best = 0;
  studentSents.forEach(function(ss){
    var b = contentWords(ss), hit = 0;
    a.forEach(function(w){ if(b.indexOf(w)>=0) hit++; });
    var r = hit / a.length;
    if(r>best) best = r;
  });
  return best;
}

function makeTimer(host, minutes, label){
  var left = minutes*60, iv = null;
  var box = el('div','card tight');
  box.style.display='flex'; box.style.alignItems='center'; box.style.gap='12px'; box.style.flexWrap='wrap';
  var t = el('span','timer'); var btn = el('button','btn soft', '▶ '+L({en:'Start',ru:'Старт',kz:'Бастау'}));
  var rs = el('button','btn ghost', U('reset'));
  box.innerHTML = '<b>'+L(label)+'</b>';
  box.appendChild(t); box.appendChild(btn); box.appendChild(rs);
  function show(){
    var m = Math.floor(left/60), s = left%60;
    t.textContent = m+':'+(s<10?'0':'')+s;
    t.classList.toggle('low', left<=300);
  }
  btn.onclick = function(){
    if(iv){ clearInterval(iv); iv=null; btn.textContent='▶ '+L({en:'Resume',ru:'Продолжить',kz:'Жалғастыру'}); return; }
    btn.textContent='⏸ '+L({en:'Pause',ru:'Пауза',kz:'Кідірту'});
    iv = setInterval(function(){ left--; show(); if(left<=0){ clearInterval(iv); iv=null; btn.textContent='⏱'; } }, 1000);
  };
  rs.onclick = function(){ if(iv){clearInterval(iv);iv=null;} left=minutes*60; show(); btn.textContent='▶ '+L({en:'Start',ru:'Старт',kz:'Бастау'}); };
  show(); host.appendChild(box);
  return { stop:function(){ if(iv) clearInterval(iv); } };
}

      block = el('div','modblock','<div class="modtitle">'+L(sc.mod)+'</div>');
      side.appendChild(block); lastMod = sc.mod;
    }

function renderProgress(){
  var n = Object.keys(state.done).length, pct = Math.round(100*n/SCREENS.length);
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progText').textContent = pct+'% '+L({en:'of the course',ru:'курса пройдено',kz:'курс өтілді'});
  document.getElementById('stepText').textContent = (state.screen+1)+' / '+SCREENS.length;
  var ids = Object.keys(state.ex), c=0, t=0;

}
function renderScreen(){
  stopTimers();
  var host = document.getElementById('content');
  host.innerHTML = '';
  var sc = SCREENS[state.screen];
  try{ sc.render(host); }
  catch(e){
    host.innerHTML = '<div class="card"><b>Render error:</b> '+esc(e.message)+'</div>';
    if(window.console) console.error(e);
  }
  document.getElementById('prevBtn').disabled = state.screen===0;
  var nb = document.getElementById('nextBtn');
  nb.textContent = state.screen===SCREENS.length-1 ? U('finish') : U('next');
  renderSidebar(); renderProgress();
  window.scrollTo(0,0);
  closeMenu();
}
function goto(i){
  if(i<0 || i>=SCREENS.length) return;
  state.screen = i; save(); renderScreen();
}
function markDoneAndNext(){
  state.done[SCREENS[state.screen].id] = true;
  save();
  if(state.screen < SCREENS.length-1) goto(state.screen+1);
  else { renderScreen(); }
}
function closeMenu(){
  document.getElementById('side').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
}
document.getElementById('nextBtn').onclick = markDoneAndNext;
document.getElementById('prevBtn').onclick = function(){ goto(state.screen-1); };
document.getElementById('menuBtn').onclick = function(){
  document.getElementById('side').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('on');
};
document.getElementById('scrim').onclick = closeMenu;
document.getElementById('langs').onclick = function(e){
  var b = e.target.closest ? e.target.closest('button') : null;
  if(!b || !b.dataset.lang) return;
  state.lang = b.dataset.lang; save();
  qsa(document.getElementById('langs'),'button').forEach(function(x){ x.classList.toggle('on', x.dataset.lang===state.lang); });
  renderScreen();
};
document.addEventListener('keydown', function(e){
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(e.key==='ArrowRight') markDoneAndNext();
  if(e.key==='ArrowLeft') goto(state.screen-1);
});

/* boot */
load();
if(state.screen>=SCREENS.length) state.screen = 0;
qsa(document.getElementById('langs'),'button').forEach(function(x){ x.classList.toggle('on', x.dataset.lang===state.lang); });
renderScreen();
</script>
</body>
</html>
